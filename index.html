<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>行途录 · 旅行回忆手账</title>
<link rel="icon" href="icons/icon-192.png">
<meta name="theme-color" content="#2f7cf6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="行途录">
<style>
:root{
  --paper:#eef4ff;
  --card:#ffffff;
  --ink:#12264f;
  --ink2:#5b7195;
  --ink3:#93a5c4;
  --line:#e3ecfa;
  --line2:#cfdef5;
  --accent:#2f7cf6;
  --accent-dark:#1e63d6;
  --moss:#10b981;
  --gold:#ffb020;
  --shadow:0 2px 6px rgba(37,99,235,.06),0 12px 32px -12px rgba(37,99,235,.18);
  --shadow-lift:0 4px 10px rgba(37,99,235,.08),0 20px 44px -12px rgba(37,99,235,.28);
  --serif:'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--sans);
  background:var(--paper);
  color:var(--ink);
  font-size:15px;
  line-height:1.7;
  min-height:100vh;
}
::selection{background:rgba(47,124,246,.22)}
button{font-family:inherit}
img{display:block}
a{color:var(--accent)}

/* ===== 顶栏 ===== */
.topbar{
  position:sticky;top:0;z-index:900;
  background:rgba(238,244,255,.85);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.topbar-in{
  max-width:1120px;margin:0 auto;padding:0 24px;
  display:flex;align-items:center;gap:22px;height:62px;
}
.logo{display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none;flex:none}
.logo svg{color:var(--accent)}
.logo b{font-family:var(--serif);font-size:21px;font-weight:700;letter-spacing:2px}
.logo span{font-size:11px;color:var(--ink3);letter-spacing:3px;margin-top:5px}
.nav{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{
  border:0;background:none;cursor:pointer;white-space:nowrap;
  font-size:14px;color:var(--ink2);padding:8px 13px;border-radius:9px;
  transition:color .18s,background .18s;
}
.nav button:hover{color:var(--ink);background:rgba(47,124,246,.08)}
.nav button.on{color:var(--accent);background:rgba(47,124,246,.1);font-weight:600}
.top-acts{display:flex;gap:8px;flex:none;align-items:center}

/* ===== 按钮 ===== */
.btn{
  display:inline-flex;align-items:center;gap:7px;border-radius:10px;cursor:pointer;
  font-size:14px;padding:9px 16px;border:1px solid transparent;line-height:1.4;
  transition:all .18s;white-space:nowrap;user-select:none;
}
.btn svg{flex:none}
.btn-p{background:linear-gradient(135deg,#2f7cf6,#38bdf8);color:#fff;box-shadow:0 2px 10px -2px rgba(47,124,246,.55)}
.btn-p:hover{background:linear-gradient(135deg,#4a8ef8,#5cc6fa);transform:translateY(-2px);box-shadow:0 8px 20px -6px rgba(47,124,246,.6)}
.btn-g{background:var(--card);border-color:var(--line2);color:var(--ink)}
.btn-g:hover{border-color:var(--accent);color:var(--accent)}
.btn-t{background:none;color:var(--ink2);padding:8px 10px}
.btn-t:hover{color:var(--accent);background:rgba(47,124,246,.07)}
.btn-d{background:#fbeeec;color:#a8402a;border-color:#ecd2cc}
.btn-d:hover{background:#a8402a;color:#fff}
.btn-sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ===== 布局 ===== */
.wrap{max-width:1120px;margin:0 auto;padding:34px 24px 90px}
.view-anim{animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

/* ===== 首页 ===== */
.hero{margin-bottom:30px}
.hero .kicker{font-size:12px;letter-spacing:5px;color:var(--accent);margin-bottom:8px}
.hero h1{font-family:var(--serif);font-size:clamp(26px,4vw,38px);font-weight:800;letter-spacing:1px;background:linear-gradient(135deg,#2f7cf6,#38bdf8);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--ink2);margin-top:8px;max-width:560px}
.stats-strip{
  display:flex;flex-wrap:wrap;gap:0;margin:26px 0 34px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden;
}
.stat-cell{flex:1;min-width:130px;padding:18px 22px;border-right:1px dashed var(--line2)}
.stat-cell:last-child{border-right:0}
.stat-cell .n{font-family:var(--serif);font-size:27px;font-weight:800;line-height:1.2;background:linear-gradient(135deg,#2f7cf6,#38bdf8);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat-cell .n small{font-size:14px;color:var(--ink2);font-weight:400;margin-left:2px}
.stat-cell .l{font-size:12px;color:var(--ink3);letter-spacing:2px;margin-top:3px}

/* 那年今天 */
.memory-card{
  display:flex;gap:18px;align-items:stretch;cursor:pointer;
  background:linear-gradient(120deg,#ffffff,#eaf3ff);
  border:1px solid #d5e5fc;border-radius:var(--r);
  padding:16px;margin-bottom:36px;box-shadow:var(--shadow);
  transition:transform .2s,box-shadow .2s;position:relative;overflow:hidden;
}
.memory-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.memory-card::before{
  content:"回忆";position:absolute;right:14px;top:10px;
  writing-mode:vertical-rl;font-family:var(--serif);font-size:12px;letter-spacing:6px;
  color:rgba(47,124,246,.35);
}
.memory-card .mc-img{width:118px;height:118px;flex:none;border-radius:10px;overflow:hidden;background:#e3eefc}
.memory-card .mc-img img{width:100%;height:100%;object-fit:cover}
.memory-card .mc-body{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.memory-card .mc-tag{font-size:12px;color:var(--accent);letter-spacing:2px;margin-bottom:4px}
.memory-card h3{font-family:var(--serif);font-size:18px;font-weight:700;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.memory-card .mc-ex{color:var(--ink2);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.memory-card .mc-meta{font-size:12px;color:var(--ink3);margin-top:6px}

/* 旅行卡片 */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 18px}
.sec-head h2{font-family:var(--serif);font-size:21px;font-weight:700;letter-spacing:1px}
.sec-head span{font-size:13px;color:var(--ink3)}
.trips-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:24px}
.trip-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;cursor:pointer;box-shadow:var(--shadow);position:relative;
  transition:transform .22s,box-shadow .22s;transform:rotate(var(--rot,0deg));
}
.trip-card:nth-child(odd){--rot:-.6deg}
.trip-card:nth-child(even){--rot:.5deg}
.trip-card:hover{transform:rotate(0) translateY(-4px);box-shadow:var(--shadow-lift)}
.trip-cover{height:172px;position:relative;overflow:hidden;background:#dbeafe}
.trip-cover img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
.trip-card:hover .trip-cover img{transform:scale(1.045)}
.trip-cover .ph-letter{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:64px;color:rgba(30,99,212,.45);
  background:linear-gradient(135deg,#dbeafe,#93c5fd);
}
.trip-body{padding:15px 17px 17px}
.trip-body h3{font-family:var(--serif);font-size:18px;font-weight:700;letter-spacing:.5px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trip-body .dest{font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:5px}
.trip-body .dest svg{color:var(--accent);flex:none}
.trip-meta{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}
.badge{
  font-size:11.5px;color:var(--ink2);background:rgba(47,124,246,.08);
  border:1px solid rgba(47,124,246,.22);border-radius:99px;padding:2px 9px;
}
.trip-ops{position:absolute;top:10px;right:10px;z-index:4;display:flex;gap:5px;opacity:0;transition:opacity .18s}
.trip-card:hover .trip-ops{opacity:1}
.icon-btn{
  width:30px;height:30px;border-radius:8px;border:0;cursor:pointer;
  background:rgba(255,255,255,.92);color:var(--ink2);display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 4px rgba(37,99,235,.2);transition:all .15s;
}
.icon-btn:hover{color:var(--accent)}
.icon-btn.del:hover{color:#a8402a;background:#fbeeec}
.new-trip-card{
  border:1.5px dashed var(--line2);border-radius:var(--r);min-height:268px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  cursor:pointer;color:var(--ink3);background:rgba(255,255,255,.5);
  transition:all .2s;font-size:14px;
}
.new-trip-card:hover{border-color:var(--accent);color:var(--accent);background:var(--card)}
.new-trip-card svg{opacity:.7}
.safe-hint{
  margin-top:40px;text-align:center;font-size:12.5px;color:var(--ink3);
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.safe-hint a{cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* ===== 空状态 ===== */
.empty{
  text-align:center;padding:70px 20px;color:var(--ink2);
  background:var(--card);border:1px dashed var(--line2);border-radius:var(--r);
}
.empty svg{color:var(--line2);margin-bottom:14px}
.empty h3{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--ink);margin-bottom:6px}
.empty p{font-size:13.5px;margin-bottom:20px}

/* ===== 旅行详情 ===== */
.back-link{
  display:inline-flex;align-items:center;gap:6px;color:var(--ink2);cursor:pointer;
  font-size:13.5px;margin-bottom:16px;border:0;background:none;padding:4px 2px;
}
.back-link:hover{color:var(--accent)}
.trip-hero{
  position:relative;border-radius:var(--r);overflow:hidden;margin-bottom:8px;
  min-height:230px;display:flex;align-items:flex-end;box-shadow:var(--shadow);
  background:linear-gradient(135deg,#2f7cf6,#38bdf8);
}
.trip-hero.covered{min-height:300px}
.trip-hero .cover-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.trip-hero .veil{
  position:absolute;inset:0;
  background:linear-gradient(to top,rgba(12,32,74,.72) 0%,rgba(12,32,74,.18) 55%,rgba(12,32,74,.05));
}
.trip-hero .th-body{position:relative;z-index:2;padding:26px 28px;color:#fff;width:100%}
.trip-hero h1{font-family:var(--serif);font-size:clamp(23px,3.4vw,32px);font-weight:800;letter-spacing:1px;margin-bottom:6px}
.trip-hero .th-sub{display:flex;flex-wrap:wrap;gap:7px 18px;font-size:13.5px;opacity:.94;align-items:center}
.trip-hero .th-sub .it{display:inline-flex;align-items:center;gap:6px}
.trip-hero .th-desc{font-size:13.5px;opacity:.85;margin-top:8px;max-width:640px}
.trip-hero .th-ops{position:absolute;top:14px;right:14px;z-index:3;display:flex;gap:7px}
.trip-hero .th-ops .icon-btn{background:rgba(255,255,255,.9)}

/* 标签页 */
.tabs{display:flex;gap:2px;border-bottom:1.5px solid var(--line);margin:20px 0 26px;overflow-x:auto}
.tabs button{
  border:0;background:none;cursor:pointer;font-size:14.5px;color:var(--ink2);
  padding:10px 16px;position:relative;white-space:nowrap;display:flex;align-items:center;gap:7px;
}
.tabs button svg{opacity:.75}
.tabs button .cnt{font-size:11px;background:rgba(47,124,246,.12);color:var(--accent);border-radius:99px;padding:1px 7px}
.tabs button::after{
  content:"";position:absolute;left:12px;right:12px;bottom:-1.5px;height:2.5px;
  background:var(--accent);border-radius:2px;transform:scaleX(0);transition:transform .2s;
}
.tabs button.on{color:var(--accent);font-weight:600}
.tabs button.on::after{transform:scaleX(1)}

/* 时间线 */
.timeline{position:relative;padding-left:30px}
.timeline::before{
  content:"";position:absolute;left:8px;top:6px;bottom:6px;width:1.5px;
  background:repeating-linear-gradient(to bottom,var(--line2) 0 6px,transparent 6px 12px);
}
.day-block{position:relative;margin-bottom:34px}
.day-block::before{
  content:"";position:absolute;left:-27px;top:6px;width:11px;height:11px;border-radius:50%;
  background:var(--card);border:2.5px solid var(--accent);
}
.day-label{font-family:var(--serif);font-size:16px;font-weight:700;margin-bottom:14px;display:flex;align-items:baseline;gap:10px}
.day-label .d1{color:var(--accent);font-weight:700}
.day-label .d2{font-size:13px;color:var(--ink3)}
.entry-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;
}
.entry-card::before{
  content:"";position:absolute;left:-25.5px;top:26px;width:7px;height:7px;border-radius:50%;
  background:var(--line2);
}
.entry-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px}
.type-chip{
  flex:none;font-size:11.5px;letter-spacing:1px;padding:2.5px 10px;border-radius:99px;
  color:#fff;background:var(--tc,var(--accent));margin-top:3px;
}
.entry-head h3{font-family:var(--serif);font-size:17.5px;font-weight:700;flex:1;min-width:0;line-height:1.5}
.entry-ops{display:flex;gap:3px;opacity:0;transition:opacity .15s;flex:none}
.entry-card:hover .entry-ops{opacity:1}
.entry-content{color:var(--ink);font-size:14.5px;white-space:pre-wrap;word-break:break-word}
.entry-place{
  display:inline-flex;align-items:center;gap:5px;margin-top:12px;font-size:12.5px;
  color:var(--ink2);background:rgba(47,124,246,.08);border:1px solid rgba(47,124,246,.2);
  border-radius:99px;padding:3px 11px;
}
.entry-place svg{color:var(--accent);flex:none}
.entry-place .no-geo{opacity:.65}
.entry-photos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.entry-photos.single{grid-template-columns:minmax(0,340px)}
.entry-photos .ep{
  aspect-ratio:1;border-radius:9px;overflow:hidden;cursor:pointer;background:#e3eefc;
}
.entry-photos .ep img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.entry-photos .ep:hover img{transform:scale(1.05)}
@media (max-width:640px){.entry-photos{grid-template-columns:repeat(3,1fr)}}

/* 照片墙 */
.masonry{columns:4 230px;column-gap:14px}
.ph-item{
  break-inside:avoid;margin-bottom:14px;border-radius:11px;overflow:hidden;cursor:pointer;
  position:relative;background:#e3eefc;box-shadow:var(--shadow);
}
.ph-item img{width:100%;transition:transform .35s}
.ph-item:hover img{transform:scale(1.03)}
.ph-item .ph-cap{
  position:absolute;left:0;right:0;bottom:0;padding:22px 12px 9px;color:#fff;font-size:12px;
  background:linear-gradient(to top,rgba(12,32,74,.72),transparent);
  opacity:0;transition:opacity .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.ph-item:hover .ph-cap{opacity:1}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.fchip{
  border:1px solid var(--line2);background:var(--card);color:var(--ink2);
  border-radius:99px;padding:6px 15px;font-size:13px;cursor:pointer;transition:all .15s;
}
.fchip:hover{border-color:var(--accent);color:var(--accent)}
.fchip.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* 地图 */
.map-box{
  height:480px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);
  box-shadow:var(--shadow);background:#e3eefc;position:relative;z-index:1;
}
.map-note{font-size:12.5px;color:var(--ink3);margin-top:10px;display:flex;gap:6px;align-items:center}
.map-fallback{
  height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;color:var(--ink3);font-size:14px;text-align:center;padding:20px;
}
.place-list{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.place-list .pl{
  display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);
  background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 13px;
}
.place-list .pl i{width:8px;height:8px;border-radius:50%;background:var(--pc,var(--accent));flex:none}
.leaflet-container{font-family:var(--sans)}
.leaflet-popup-content-wrapper{border-radius:10px;box-shadow:var(--shadow-lift)}
.leaflet-popup-content{margin:11px 15px;font-size:13px;line-height:1.6}

/* 统计 */
.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-bottom:34px}
.stat-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:20px 22px;box-shadow:var(--shadow);
}
.stat-card .n{font-family:var(--serif);font-size:31px;font-weight:800;line-height:1.15;background:linear-gradient(135deg,#2f7cf6,#38bdf8);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat-card .n small{font-size:14px;color:var(--ink2);font-weight:400}
.stat-card .l{font-size:12.5px;color:var(--ink3);letter-spacing:2px;margin-top:4px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px 26px;box-shadow:var(--shadow);margin-bottom:22px}
.panel h3{font-family:var(--serif);font-size:17px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.panel h3 svg{color:var(--accent)}
.bar-row{display:flex;align-items:center;gap:14px;margin-bottom:11px}
.bar-row .by{width:56px;font-family:var(--serif);font-size:15px;font-weight:700;flex:none}
.bar-row .bar{flex:1;height:20px;background:rgba(47,124,246,.08);border-radius:6px;overflow:hidden}
.bar-row .bar i{display:block;height:100%;background:linear-gradient(90deg,#38bdf8,#2f7cf6);border-radius:6px;transition:width .6s ease}
.bar-row .bn{width:70px;font-size:12.5px;color:var(--ink2);text-align:right;flex:none}

/* ===== 弹窗 ===== */
.modal-overlay{
  position:fixed;inset:0;z-index:1000;background:rgba(18,38,79,.45);
  display:flex;align-items:center;justify-content:center;padding:20px;
  animation:mIn .2s ease;backdrop-filter:blur(3px);
}
@keyframes mIn{from{opacity:0}to{opacity:1}}
.modal-card{
  background:var(--card);border-radius:16px;width:100%;max-width:600px;
  max-height:88vh;overflow-y:auto;box-shadow:0 24px 70px -12px rgba(18,38,79,.4);
  animation:mUp .25s ease;padding:26px 28px;
}
.modal-card.narrow{max-width:440px}
@keyframes mUp{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.modal-card h3{font-family:var(--serif);font-size:20px;font-weight:700;margin-bottom:20px;letter-spacing:1px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;color:var(--ink2);margin-bottom:7px;font-weight:500}
.field label em{color:var(--accent);font-style:normal}
.field input[type=text],.field input[type=date],.field textarea{
  width:100%;border:1px solid var(--line2);border-radius:10px;background:#ffffff;
  padding:10px 13px;font-size:14.5px;font-family:inherit;color:var(--ink);
  transition:border .15s,box-shadow .15s;
}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,124,246,.12)}
.field textarea{resize:vertical;min-height:120px;line-height:1.75}
.field-row{display:flex;gap:12px}
.field-row .field{flex:1}
.type-picker{display:flex;gap:7px;flex-wrap:wrap}
.type-picker button{
  border:1px solid var(--line2);background:#ffffff;color:var(--ink2);
  border-radius:99px;padding:6px 15px;font-size:13px;cursor:pointer;transition:all .15s;

/* ===== 灯箱 ===== */
.lightbox{
  position:fixed;inset:0;z-index:1100;background:rgba(10,25,55,.93);

<script>
/* ============================================================
   行途录 · 旅行回忆手账 —— 纯本地单文件应用
   数据全部保存在本浏览器 IndexedDB 中,可导出/导入 JSON 备份
   ============================================================ */
'use strict';

/* ---------- 小工具 ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const uid=()=>(crypto.randomUUID?crypto.randomUUID():'id-'+Date.now().toString(36)+Math.random().toString(36).slice(2,10));
const WD='日一二三四五六';
const pdate=s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d);};
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const fmtMD=s=>{const p=String(s).split('-');return (+p[1])+'月'+(+p[2])+'日';};
const fmtYMD=s=>{const p=String(s).split('-');return p[0]+'年'+(+p[1])+'月'+(+p[2])+'日';};
const fmtWeek=s=>'周'+WD[pdate(s).getDay()];
const tripDays=t=>(t.startDate&&t.endDate)?Math.max(1,Math.round((pdate(t.endDate)-pdate(t.startDate))/864e5)+1):0;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));

const TYPES=[
  {k:'见闻',c:'#2f7cf6'},{k:'趣事',c:'#ffb020'},{k:'美食',c:'#ff7d54'},
  {k:'住宿',c:'#10b981'},{k:'交通',c:'#8b5cf6'},{k:'心情',c:'#ec4899'},
];
const typeColor=k=>(TYPES.find(t=>t.k===k)||TYPES[0]).c;
const PALETTE=['#2f7cf6','#10b981','#ff7d54','#8b5cf6','#ec4899','#ffb020','#06b6d4','#f43f5e'];

function icon(name,s=16){
  const P={
    plus:'<path d="M12 5v14"/><path d="M5 12h14"/>',
    x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
    edit:'<path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>',
    trash:'<path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="m19 6-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/>',
    pin:'<path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
    back:'<path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>',
    left:'<path d="m15 18-6-6 6-6"/>',
    right:'<path d="m9 18 6-6-6-6"/>',
    search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
    compass:'<circle cx="12" cy="12" r="10"/><path d="m16.2 7.8-2.1 6.3-6.3 2.1 2.1-6.3z"/>',
    image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/>',
    map:'<path d="m9 3-6 2v14l6-2 6 2 6-2V3l-6 2-6-2Z"/><path d="M9 3v14"/><path d="M15 5v14"/>',
    chart:'<path d="M3 3v18h18"/><path d="M8 17v-5"/><path d="M13 17V8"/><path d="M18 17v-3"/>',
    book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/>',
    camera:'<path d="M14.5 4h-5L7.5 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3.5L14.5 4Z"/><circle cx="12" cy="13" r="3"/>',
    calendar:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/>',
    home2:'<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M9 22V12h6v10"/>',
  };
  return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+(P[name]||'')+'</svg>';
}

/* ---------- IndexedDB ---------- */
let db=null;
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open('footprints-db',1);
    r.onupgradeneeded=e=>{
      const d=e.target.result;
      d.createObjectStore('trips',{keyPath:'id'});
      d.createObjectStore('entries',{keyPath:'id'});
      d.createObjectStore('photos',{keyPath:'id'});
    };
    r.onsuccess=e=>res(e.target.result);
    r.onerror=e=>rej(e.target.error);
  });
}
const idbReq=(mode,store,fn)=>new Promise((res,rej)=>{
  const tx=db.transaction(store,mode);const r=fn(tx.objectStore(store));
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
});
const idbPut=(s,v)=>idbReq('readwrite',s,o=>o.put(v));
const idbDel=(s,k)=>idbReq('readwrite',s,o=>o.delete(k));
const idbAll=s=>idbReq('readonly',s,o=>o.getAll());
const idbClear=s=>idbReq('readwrite',s,o=>o.clear());

/* ---------- 全局状态 ---------- */
const S={trips:[],entries:[],photos:[],view:'home',tripId:null,tab:'timeline',galleryFilter:'all'};
let LB=null;           // 灯箱 {items,i}
let ED=null;           // 游记编辑草稿
let maps={};           // leaflet 实例
let entrySeq=0;

const tripById=id=>S.trips.find(t=>t.id===id);
const entryById=id=>S.entries.find(e=>e.id===id);
const photoById=id=>S.photos.find(p=>p.id===id);
const entriesOf=tid=>S.entries.filter(e=>e.tripId===tid).sort((a,b)=>a.date===b.date?(a.createdAt||0)-(b.createdAt||0):(a.date<b.date?-1:1));
const photosOfEntry=eid=>S.photos.filter(p=>p.entryId===eid);
const photosOfTrip=tid=>{
  const em={};entriesOf(tid).forEach((e,i)=>em[e.id]=i);
  return S.photos.filter(p=>p.tripId===tid).sort((a,b)=>(em[a.entryId]??99)-(em[b.entryId]??99));
};
const tripCover=t=>photosOfTrip(t.id)[0]||null;

/* ---------- toast / 弹窗 ---------- */
let toastTimer=null;
function toast(msg){
  let el=$('#toast');
  if(!el){el=document.createElement('div');el.id='toast';el.className='toast';document.body.appendChild(el);}
  el.textContent=msg;el.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2600);
}
const modalStack=[];
function openModal(html,narrow){
  const ov=document.createElement('div');ov.className='modal-overlay';
  ov.innerHTML='<div class="modal-card'+(narrow?' narrow':'')+'">'+html+'</div>';
  document.body.appendChild(ov);
  const api={ov,close(){ov.remove();const i=modalStack.indexOf(api);if(i>-1)modalStack.splice(i,1);}};
  ov.addEventListener('mousedown',e=>{if(e.target===ov)api.close();});
  modalStack.push(api);
  return api;
}
function confirmBox(title,msg,okText){
  return new Promise(res=>{
    const m=openModal(
      '<h3>'+esc(title)+'</h3><p class="confirm-msg">'+msg+'</p>'+
      '<div class="modal-foot"><button class="btn btn-g" data-act="no">取消</button>'+
      '<button class="btn btn-d" data-act="yes">'+esc(okText||'删除')+'</button></div>',true);
    m.ov.querySelector('[data-act=no]').onclick=()=>{m.close();res(false);};
    m.ov.querySelector('[data-act=yes]').onclick=()=>{m.close();res(true);};
  });
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(LB){closeLB();return;}
    const top=modalStack[modalStack.length-1];if(top)top.close();
  }
  if(LB&&!modalStack.length){
    if(e.key==='ArrowLeft')lbNav(-1);
    if(e.key==='ArrowRight')lbNav(1);
  }
});

/* ---------- 照片压缩 ---------- */
function compressImage(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      let w=img.naturalWidth,h=img.naturalHeight;
      const MAX=1800;
      if(Math.max(w,h)>MAX){const r=MAX/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r);}
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      res({dataUrl:c.toDataURL('image/jpeg',.85),w,h});
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('图片读取失败'));};
    img.src=url;
  });
}

/* ============================================================
   渲染
   ============================================================ */
function render(){
  if(maps.trip){maps.trip.remove();maps.trip=null;}
  if(maps.global){maps.global.remove();maps.global=null;}
  const app=$('#app');
  renderNav();
  window.scrollTo(0,0);
  if(S.view==='home')app.innerHTML=viewHome();
  else if(S.view==='trip')app.innerHTML=viewTrip();
  else if(S.view==='gallery')app.innerHTML=viewGallery();
  else if(S.view==='map')app.innerHTML=viewGlobalMap();
  else if(S.view==='stats')app.innerHTML=viewStats();
  app.classList.remove('view-anim');void app.offsetWidth;app.classList.add('view-anim');
  if(S.view==='trip'&&S.tab==='map')initTripMap();
  if(S.view==='map')initGlobalMap();
}

const NAVS=[
  {k:'home',t:'我的旅行',i:'home2'},
  {k:'gallery',t:'照片回忆',i:'image'},
  {k:'map',t:'足迹地图',i:'map'},
  {k:'stats',t:'旅行统计',i:'chart'},
];
function renderNav(){
  $('#nav').innerHTML=NAVS.map(n=>
    '<button class="'+(S.view===n.k||(n.k==='home'&&S.view==='trip')?'on':'')+'" onclick="A.nav(\''+n.k+'\')">'+icon(n.i,15)+esc(n.t)+'</button>'
  ).join('');
}

/* ---------- 首页 ---------- */
function globalStats(){
  const days=S.trips.reduce((a,t)=>a+tripDays(t),0);
  const cities=new Set(S.entries.filter(e=>e.placeName).map(e=>e.placeName)).size;
  const words=S.entries.reduce((a,e)=>a+(e.content||'').length,0);
  return {trips:S.trips.length,days,cities,photos:S.photos.length,words};
}
function memoryCard(){
  const now=new Date();
  const mm=String(now.getMonth()+1).padStart(2,'0'),dd=String(now.getDate()).padStart(2,'0');
  const md=mm+'-'+dd;
  const past=S.entries.filter(e=>e.date<todayStr());
  if(!past.length)return '';
  const exact=past.filter(e=>String(e.date).slice(5)===md).sort((a,b)=>a.date<b.date?1:-1);
  let e,label;
  if(exact.length){e=exact[0];const y=now.getFullYear()-+e.date.slice(0,4);label=(y<=1?'一年':y+'年')+'前的今天';}
  else{e=past[Math.floor(Math.random()*past.length)];label='随手翻到的一页';}
  const t=tripById(e.tripId);if(!t)return '';
  const ph=photosOfEntry(e.id)[0];
  const ex=(e.content||'').replace(/\s+/g,' ').slice(0,80);
  return '<div class="memory-card" onclick="A.openTrip(\''+t.id+'\')">'+
    '<div class="mc-img">'+(ph?'<img src="'+ph.dataUrl+'" alt="">':'')+'</div>'+
    '<div class="mc-body"><div class="mc-tag">'+esc(label)+'</div>'+
    '<h3>'+esc(e.title||'无题的一页')+'</h3>'+
    (ex?'<div class="mc-ex">'+esc(ex)+'</div>':'')+
    '<div class="mc-meta">'+esc(t.name)+(e.date?' · '+fmtYMD(e.date):'')+'</div></div></div>';
}
function viewHome(){
  const st=globalStats();
  let grid;
  if(!S.trips.length){
    grid='<div class="empty" style="margin-top:6px">'+icon('compass',54)+
      '<h3>还没有旅程</h3><p>创建第一段旅行,开始记录沿途的风景、见闻与趣事</p>'+
      '<button class="btn btn-p" onclick="A.tripModal()">'+icon('plus',15)+'新建旅行</button></div>';
  }else{
    grid='<div class="trips-grid"><div class="new-trip-card" onclick="A.tripModal()">'+icon('plus',26)+'<span>新建旅行</span></div>'+
      S.trips.slice().sort((a,b)=>(b.startDate||'').localeCompare(a.startDate||'')).map(t=>{
        const cov=tripCover(t),n=entriesOf(t.id).length,np=photosOfTrip(t.id).length,days=tripDays(t);
        const range=t.startDate?(t.endDate&&t.endDate!==t.startDate?fmtMD(t.startDate)+' — '+fmtYMD(t.endDate):fmtYMD(t.startDate)):'';
        return '<div class="trip-card" onclick="A.openTrip(\''+t.id+'\')">'+
          '<div class="trip-ops">'+
            '<button class="icon-btn" title="编辑" onclick="event.stopPropagation();A.tripModal(\''+t.id+'\')">'+icon('edit',14)+'</button>'+
            '<button class="icon-btn del" title="删除" onclick="event.stopPropagation();A.delTrip(\''+t.id+'\')">'+icon('trash',14)+'</button></div>'+
          '<div class="trip-cover">'+(cov?'<img src="'+cov.dataUrl+'" alt="">':'<div class="ph-letter">'+esc((t.destination||t.name||'旅').slice(0,1))+'</div>')+'</div>'+
          '<div class="trip-body"><h3>'+esc(t.name)+'</h3>'+
          (t.destination?'<div class="dest">'+icon('pin',13)+esc(t.destination)+'</div>':'')+
          (range?'<div class="dest" style="margin-top:2px">'+esc(range)+'</div>':'')+
          '<div class="trip-meta">'+
            (days?'<span class="badge">'+days+' 天</span>':'')+
            '<span class="badge">'+n+' 篇游记</span>'+
            (np?'<span class="badge">'+np+' 张照片</span>':'')+
          '</div></div></div>';
      }).join('')+'</div>';
  }
  return '<div class="hero"><div class="kicker">XINGTU JOURNAL</div>'+
    '<h1>走过的每一步,都值得珍藏</h1><p>时间线游记、照片墙、地图足迹——写给未来某一天,想再走一遍来时路的你。</p></div>'+
    '<div class="stats-strip">'+
      '<div class="stat-cell"><div class="n">'+st.trips+'<small>次</small></div><div class="l">旅行</div></div>'+
      '<div class="stat-cell"><div class="n">'+st.cities+'<small>城</small></div><div class="l">足迹</div></div>'+
      '<div class="stat-cell"><div class="n">'+st.days+'<small>天</small></div><div class="l">在途</div></div>'+
      '<div class="stat-cell"><div class="n">'+st.photos+'<small>张</small></div><div class="l">照片</div></div>'+
      '<div class="stat-cell"><div class="n">'+st.words+'<small>字</small></div><div class="l">见闻</div></div>'+
    '</div>'+
    memoryCard()+
    '<div class="sec-head"><h2>我的旅行</h2><span>'+S.trips.length+' 段旅程</span></div>'+grid+
    '<div class="safe-hint">'+icon('book',14)+'数据只保存在这台设备的浏览器里 · 记得定期 <a onclick="A.doExport()">导出备份</a></div>';
}

/* ---------- 旅行详情 ---------- */
function viewTrip(){
  const t=tripById(S.tripId);
  if(!t){S.view='home';return viewHome();}
  const es=entriesOf(t.id),ps=photosOfTrip(t.id);
  const cov=tripCover(t);
  const range=t.startDate?(t.endDate&&t.endDate!==t.startDate?fmtYMD(t.startDate)+' — '+fmtYMD(t.endDate):fmtYMD(t.startDate)):'';
  let tabHtml='';
  if(S.tab==='timeline')tabHtml=tabTimeline(t,es);
  else if(S.tab==='gallery')tabHtml=tabGallery(t,ps);
  else tabHtml=tabMap(t,es);
  const tabs=[

/* ---------- 地图初始化(动态加载 Leaflet,带 CDN 回退) ---------- */
let leafletPromise=null;
function ensureLeaflet(){
  if(window.L)return Promise.resolve(true);
  if(!leafletPromise){
    leafletPromise=(async()=>{
      const bases=['https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/','https://unpkg.com/leaflet@1.9.4/dist/'];
      for(const b of bases){
        try{
          await new Promise((res,rej)=>{const l=document.createElement('link');l.rel='stylesheet';l.href=b+'leaflet.min.css';l.onload=res;l.onerror=rej;document.head.appendChild(l);});
          await new Promise((res,rej)=>{const s=document.createElement('script');s.src=b+'leaflet.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s);});
          if(window.L)return true;
        }catch(e){/* 尝试下一个 CDN */}
      }
      return false;
    })();
  }
  return leafletPromise;
}
const TILE_URL='https://tile.openstreetmap.org/{z}/{x}/{y}.png';
const TILE_ATTR='&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors';
function makeMap(el){
  const m=L.map(el,{scrollWheelZoom:true});
  L.tileLayer(TILE_URL,{maxZoom:19,attribution:TILE_ATTR}).addTo(m);
  return m;
}
function mapFallback(el,msg){
  el.innerHTML='<div class="map-fallback">'+icon('map',40)+'<div>'+esc(msg)+'</div></div>';
}
function popupHtml(e){
  const t=tripById(e.tripId);
  return '<b style="font-family:serif">'+esc(e.placeName||'')+'</b><br>'+
    (t?esc(t.name)+' · ':'')+(e.date?fmtYMD(e.date):'')+
    (e.title?'<br>'+esc(e.title):'');
}
async function initTripMap(){
  const el0=document.getElementById('trip-map');if(!el0)return;
  if(!await ensureLeaflet()){mapFallback(el0,'地图组件未能加载(可能处于离线状态),其余功能不受影响');return;}
  const el=document.getElementById('trip-map');if(!el||!el.isConnected)return;
  const t=tripById(S.tripId);if(!t)return;
  const located=entriesOf(t.id).filter(e=>e.lat!=null&&e.lng!=null);
  if(!located.length){mapFallback(el,'还没有定位的地点,写游记时为地点搜索定位即可点亮这里');return;}
  const m=makeMap(el);maps.trip=m;
  const pts=located.map(e=>[e.lat,e.lng]);
  if(pts.length>1)L.polyline(pts,{color:'#2f7cf6',weight:2.5,opacity:.75,dashArray:'6 7'}).addTo(m);
  located.forEach((e,i)=>{
    L.circleMarker([e.lat,e.lng],{radius:7,color:'#fff',weight:2,fillColor:typeColor(e.type),fillOpacity:.95})
      .addTo(m).bindPopup(popupHtml(e));
  });
  m.fitBounds(pts,{padding:[42,42],maxZoom:13});
  setTimeout(()=>m.invalidateSize(),120);
}
async function initGlobalMap(){
  const el0=document.getElementById('global-map');if(!el0)return;
  if(!await ensureLeaflet()){mapFallback(el0,'地图组件未能加载(可能处于离线状态),其余功能不受影响');return;}
  const el=document.getElementById('global-map');if(!el||!el.isConnected)return;
  const located=S.entries.filter(e=>e.lat!=null&&e.lng!=null&&tripById(e.tripId));
  if(!located.length){mapFallback(el,'去过并定位的地方,都会点亮在这张地图上');return;}
  const m=makeMap(el);maps.global=m;
  const bounds=[];
  S.trips.forEach((t,ti)=>{
    const es=entriesOf(t.id).filter(e=>e.lat!=null&&e.lng!=null);
    if(!es.length)return;
    const c=PALETTE[ti%PALETTE.length];
    const pts=es.map(e=>[e.lat,e.lng]);bounds.push(...pts);
    if(pts.length>1)L.polyline(pts,{color:c,weight:2.5,opacity:.7,dashArray:'6 7'}).addTo(m);
    es.forEach(e=>{
      L.circleMarker([e.lat,e.lng],{radius:7,color:'#fff',weight:2,fillColor:c,fillOpacity:.95})
        .addTo(m).bindPopup(popupHtml(e));
    });
  });
  if(bounds.length)m.fitBounds(bounds,{padding:[42,42],maxZoom:10});
  setTimeout(()=>m.invalidateSize(),120);
}

/* ---------- 灯箱 ---------- */
function openLB(items,i){
  LB={items,i};
  let el=$('#lightbox');
  if(!el){el=document.createElement('div');el.id='lightbox';el.className='lightbox';document.body.appendChild(el);}
  el.style.display='flex';
  renderLB();
}
function renderLB(){
  const el=$('#lightbox');if(!LB||!el)return;
  const it=LB.items[LB.i];
  el.innerHTML=
    '<div class="lb-count">'+(LB.i+1)+' / '+LB.items.length+'</div>'+
    '<button class="btn lb-close" style="width:44px;height:44px;border-radius:50%;padding:0;justify-content:center;background:rgba(255,255,255,.12);border:0" onclick="A.lbClose()" aria-label="关闭">'+icon('x',18)+'</button>'+
    (LB.items.length>1?'<button class="lb-btn lb-prev" onclick="A.lbNav(-1)" aria-label="上一张">'+icon('left',20)+'</button>'+
    '<button class="lb-btn lb-next" onclick="A.lbNav(1)" aria-label="下一张">'+icon('right',20)+'</button>':'')+
    '<img src="'+it.src+'" alt="'+esc(it.cap||'')+'">'+
    (it.cap?'<div class="lb-cap"><b>'+esc(it.cap)+'</b>'+(it.sub?esc(it.sub):'')+'</div>':'');
  el.onclick=e=>{if(e.target===el)closeLB();};
}
function lbNav(d){if(!LB)return;LB.i=(LB.i+d+LB.items.length)%LB.items.length;renderLB();}
function closeLB(){LB=null;const el=$('#lightbox');if(el)el.style.display='none';}

/* ============================================================
   动作 (A)
   ============================================================ */
const A={
  nav(v){S.view=v;S.tripId=null;render();},
  tab(k){S.tab=k;render();},
  openTrip(id){S.view='trip';S.tripId=id;S.tab='timeline';render();},
  galleryFilter(id){S.galleryFilter=id;render();},

  /* ---- 灯箱 ---- */
  lbEntry(entryId,i){
    const e=entryById(entryId);if(!e)return;
    const t=tripById(e.tripId);
    const items=photosOfEntry(e.id).map(p=>({src:p.dataUrl,cap:e.title||'',sub:(t?t.name+' · ':'')+(e.date?fmtYMD(e.date):'')+(e.placeName?' · '+e.placeName:'')}));
    openLB(items,i);
  },
  lbTrip(tripId,i){
    const ps=photosOfTrip(tripId);if(!ps[i])return;
    const em={};entriesOf(tripId).forEach(e=>em[e.id]=e);
    const t=tripById(tripId);
    const items=ps.map(p=>{const e=em[p.entryId]||{};return{src:p.dataUrl,cap:e.title||'',sub:(t?t.name+' · ':'')+(e.date?fmtYMD(e.date):'')};});
    openLB(items,i);
  },
  lbGallery(i){
    const all=galleryItems();const f=S.galleryFilter==='all'?all:all.filter(x=>x.p.tripId===S.galleryFilter);
    const items=f.map(x=>({src:x.p.dataUrl,cap:x.e.title||'',sub:(x.t?x.t.name+' · ':'')+(x.e.date?fmtYMD(x.e.date):'')}));
    if(items[i])openLB(items,i);
  },
  lbClose(){closeLB();},
  lbNav(d){lbNav(d);},

  /* ---- 旅行表单 ---- */
  tripModal(id){
    const t=id?tripById(id):null;
    const m=openModal(
      '<h3>'+(t?'编辑旅行':'新建旅行')+'</h3>'+
      '<div class="field"><label>旅行名称 <em>*</em></label><input type="text" id="f-name" maxlength="40" placeholder="例如:大理的风、川西的雪"></div>'+
      '<div class="field"><label>目的地</label><input type="text" id="f-dest" maxlength="40" placeholder="城市、国家或区域,如:云南 · 大理"></div>'+
      '<div class="field-row">'+
        '<div class="field"><label>开始日期</label><input type="date" id="f-start"></div>'+
        '<div class="field"><label>结束日期</label><input type="date" id="f-end"></div>'+
      '</div>'+
      '<div class="field"><label>一句话印象</label><textarea id="f-desc" style="min-height:76px" maxlength="200" placeholder="这段旅程对你意味着什么?"></textarea></div>'+
      '<div class="modal-foot"><button class="btn btn-g" data-x>取消</button>'+
      '<button class="btn btn-p" data-ok>'+(t?'保存修改':'创建旅行')+'</button></div>',true);
    m.ov.querySelector('[data-x]').onclick=m.close;
    const $n=m.ov.querySelector('#f-name'),$d=m.ov.querySelector('#f-dest'),
          $s=m.ov.querySelector('#f-start'),$e=m.ov.querySelector('#f-end'),$c=m.ov.querySelector('#f-desc');
    if(t){$n.value=t.name||'';$d.value=t.destination||'';$s.value=t.startDate||'';$e.value=t.endDate||'';$c.value=t.desc||'';}
    $n.focus();
    m.ov.querySelector('[data-ok]').onclick=async()=>{
      const name=$n.value.trim();
      if(!name){toast('给这段旅程起个名字吧');$n.focus();return;}
      const startDate=$s.value||null,endDate=$e.value||null;
      if(startDate&&endDate&&endDate<startDate){toast('结束日期不能早于开始日期');return;}
      const obj=t||{id:uid(),createdAt:Date.now()};
      obj.name=name;obj.destination=$d.value.trim();obj.startDate=startDate;obj.endDate=endDate;obj.desc=$c.value.trim();
      await idbPut('trips',obj);
      if(!t)S.trips.push(obj);else Object.assign(tripById(id),obj);
      m.close();toast(t?'旅行已更新':'新的旅程开始了');
      if(!t&&S.view!=='home'){S.view='home';}
      render();
    };
  },

  async delTrip(id){
    const t=tripById(id);if(!t)return;
    const es=entriesOf(id),ps=photosOfTrip(id);
    const ok=await confirmBox('删除「'+esc(t.name)+'」?',
      '将同时删除其中 <b>'+es.length+'</b> 篇游记与 <b>'+ps.length+'</b> 张照片,此操作无法撤销。');
    if(!ok)return;
    for(const p of ps)await idbDel('photos',p.id);
    for(const e of es)await idbDel('entries',e.id);
    await idbDel('trips',id);
    S.photos=S.photos.filter(p=>p.tripId!==id);
    S.entries=S.entries.filter(e=>e.tripId!==id);
    S.trips=S.trips.filter(x=>x.id!==id);
    S.view='home';S.tripId=null;
    render();toast('旅程已删除');
  },

  /* ---- 游记表单 ---- */
  entryModal(tripId,entryId){
    const t=tripById(tripId);if(!t)return;
    const e=entryId?entryById(entryId):null;
    ED={
      entryId:entryId||null,tripId,type:e?e.type||'见闻':'见闻',
      photoIds:e?e.photoIds.slice():[],newPhotos:[],removedIds:[],
      lat:e?e.lat:null,lng:e?e.lng:null,
    };
    const m=openModal(
      '<h3>'+(e?'编辑这一页':'写下旅程中的一页')+'</h3>'+
      '<div class="field-row">'+
        '<div class="field" style="flex:0 0 168px"><label>日期 <em>*</em></label><input type="date" id="f-date"></div>'+
        '<div class="field" style="flex:1"><label>类型</label><div class="type-picker" id="f-types">'+
          TYPES.map(x=>'<button type="button" data-t="'+x.k+'" style="--tc:'+x.c+'">'+x.k+'</button>').join('')+'</div></div>'+
      '</div>'+
      '<div class="field"><label>标题</label><input type="text" id="f-etime" maxlength="60" placeholder="这一页的标题(可留空)"></div>'+
      '<div class="field"><label>见闻与故事</label><textarea id="f-content" placeholder="今天看到了什么、遇到了谁、发生了什么有趣的事……"></textarea></div>'+
      '<div class="field"><label>地点(可选,定位后显示在足迹地图上)</label><div class="place-row">'+
        '<input type="text" id="f-place" maxlength="80" placeholder="如:洱海、大理古城">'+
        '<button class="btn btn-g" id="f-search">'+icon('search',14)+'搜索定位</button></div>'+
        '<div class="place-status none" id="f-pstatus">未定位(不影响保存)</div>'+
        '<div class="place-results" id="f-results" hidden></div></div>'+
      '<div class="field"><label>照片</label>'+
        '<button class="btn btn-g btn-sm" id="f-pick">'+icon('camera',14)+'选择照片(可多选)</button>'+
        '<input type="file" id="f-files" accept="image/*" multiple hidden>'+
        '<div class="photo-grid" id="f-grid"></div></div>'+
      '<div class="modal-foot"><button class="btn btn-g" data-x>取消</button>'+
      '<button class="btn btn-p" data-ok>保存这一页</button></div>');
    m.ov.querySelector('[data-x]').onclick=m.close;

    const $d=m.ov.querySelector('#f-date'),$c=m.ov.querySelector('#f-content'),
          $ti=m.ov.querySelector('#f-etime'),$p=m.ov.querySelector('#f-place'),
          $st=m.ov.querySelector('#f-pstatus');
    const today=todayStr();
    const defDate=e?e.date:(t.endDate?clampDate(today,t.startDate||today,t.endDate):(t.startDate||today));
    $d.value=defDate;
    function clampDate(v,a,b){if(a&&v<a)return a;if(b&&v>b)return b;return v;}
    if(e){$ti.value=e.title||'';$c.value=e.content||'';$p.value=e.placeName||'';
      if(e.lat!=null)$st.textContent='已定位 ('+(+e.lat).toFixed(3)+', '+(+e.lng).toFixed(3)+')',$st.classList.remove('none');}
    // 类型选择
    const tp=m.ov.querySelector('#f-types');
    function paintTypes(){tp.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.t===ED.type));}
    tp.addEventListener('click',ev=>{const b=ev.target.closest('button');if(b){ED.type=b.dataset.t;paintTypes();}});
    paintTypes();

    // 照片
    const $files=m.ov.querySelector('#f-files'),$grid=m.ov.querySelector('#f-grid');
    function renderGrid(){
      const olds=ED.photoIds.map(pid=>({pid,p:photoById(pid)})).filter(x=>x.p);
      const news=ED.newPhotos.map((x,i)=>({np:x,i}));
      $grid.innerHTML=[...olds.map(x=>
          '<div class="pg"><img src="'+x.p.dataUrl+'" alt=""><button class="rm" data-old="'+x.pid+'" aria-label="移除">'+icon('x',11)+'</button></div>'),
        ...news.map(x=>
          '<div class="pg"><img src="'+x.np.dataUrl+'" alt=""><button class="rm" data-new="'+x.i+'" aria-label="移除">'+icon('x',11)+'</button></div>')
      ].join('');
      $grid.querySelectorAll('[data-old]').forEach(b=>b.onclick=()=>{ED.photoIds=ED.photoIds.filter(i=>i!==b.dataset.old);ED.removedIds.push(b.dataset.old);renderGrid();});
      $grid.querySelectorAll('[data-new]').forEach(b=>b.onclick=()=>{ED.newPhotos.splice(+b.dataset.new,1);renderGrid();});
    }
    m.ov.querySelector('#f-pick').onclick=()=>$files.click();
    $files.onchange=async()=>{
      const fs=[...$files.files];if(!fs.length)return;
      for(const f of fs){
        try{ED.newPhotos.push(await compressImage(f));}
        catch(err){toast('有一张图片读取失败,已跳过');}
      }
      $files.value='';renderGrid();
    };
    renderGrid();

    // 地点搜索
    const $res=m.ov.querySelector('#f-results');
    m.ov.querySelector('#f-search').onclick=async()=>{
      const q=$p.value.trim();
      if(!q){toast('先填写地点名称,再搜索定位');$p.focus();return;}
      $res.hidden=true;$st.textContent='正在搜索「'+q+'」……';
      try{
        const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&accept-language=zh-CN&q='+encodeURIComponent(q));
        const list=await r.json();
        if(!list.length){$st.textContent='没有找到这个地点,可以直接换个说法再试,或不定位保存';return;}
        $st.textContent='找到 '+list.length+' 个结果,点击选择:';
        $res.innerHTML=list.map((x,i)=>{
          const parts=String(x.display_name).split(',').map(s=>s.trim()).slice(0,3).join(' · ');
          return '<button data-i="'+i+'">'+esc(parts)+'</button>';
        }).join('');
        $res.hidden=false;
        $res.querySelectorAll('button').forEach(b=>b.onclick=()=>{
          const x=list[+b.dataset.i];
          ED.lat=parseFloat(x.lat);ED.lng=parseFloat(x.lon);
          $p.value=String(x.display_name).split(',').map(s=>s.trim()).slice(0,3).join(' · ');
          $st.textContent='已定位 ('+ED.lat.toFixed(3)+', '+ED.lng.toFixed(3)+')';
          $st.classList.remove('none');$res.hidden=true;
        });
      }catch(err){
        $st.textContent='定位服务暂时不可用(可能离线),可以先不定位保存';
      }
    };

    m.ov.querySelector('[data-ok]').onclick=async()=>{
      const date=$d.value;
      if(!date){toast('选择这一页的日期');$d.focus();return;}
      const title=$ti.value.trim(),content=$c.value.trim(),place=$p.value.trim();
      if(!title&&!content&&!ED.photoIds.length&&!ED.newPhotos.length){toast('写点什么,或放一张照片吧');$c.focus();return;}
      // 移除被删掉的旧照片
      for(const pid of ED.removedIds){const p=photoById(pid);if(p){await idbDel('photos',pid);S.photos=S.photos.filter(x=>x.id!==pid);}}
      // 保存新照片
      const newIds=[];
      for(const np of ED.newPhotos){
        const ph={id:uid(),tripId,entryId:null,dataUrl:np.dataUrl,w:np.w,h:np.h};
        newIds.push(ph.id);S.photos.push(ph);await idbPut('photos',ph);
      }
      const obj=e?Object.assign(e):{id:uid(),tripId,createdAt:Date.now()};
      Object.assign(obj,{date,type:ED.type,title,content,placeName:place||null,
        lat:ED.lat,lng:ED.lng,photoIds:[...ED.photoIds,...newIds],updatedAt:Date.now()});
      await idbPut('entries',obj);
      if(!e)S.entries.push(obj);
      newIds.forEach(nid=>{const p=photoById(nid);if(p)p.entryId=obj.id;});
      m.close();toast(e?'这一页已更新':'又多了一页回忆');
      render();
    };
  },

  async delEntry(id){
    const e=entryById(id);if(!e)return;
    const ps=photosOfEntry(id);
    const ok=await confirmBox('删除这一页游记?',(e.title?'「'+esc(e.title)+'」':'这一页')+(ps.length?' 与它的 '+ps.length+' 张照片':'')+' 将被删除,无法恢复。');
    if(!ok)return;
    for(const p of ps)await idbDel('photos',p.id);
    await idbDel('entries',id);
    S.photos=S.photos.filter(p=>p.entryId!==id);
    S.entries=S.entries.filter(x=>x.id!==id);
    render();toast('已删除');
  },

  /* ---- 导出 / 导入 ---- */
  async doExport(){
    if(!S.trips.length&&!S.photos.length){toast('还没有内容可以备份');return;}
    const data={app:'footprints',version:1,exportedAt:new Date().toISOString(),trips:S.trips,entries:S.entries,photos:S.photos};
    const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    const d=new Date();
    a.download='行途录备份_'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'.json';
    a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast('备份文件已导出');
  },
  doImport(){$('#import-file').click();},
};

/* 导入处理 */
$('#import-file').addEventListener('change',async ev=>{
  const f=ev.target.files[0];ev.target.value='';
  if(!f)return;
  try{
    const text=await f.text();
    const j=JSON.parse(text);
    if(!j||!Array.isArray(j.trips)||!Array.isArray(j.entries)||!Array.isArray(j.photos))throw new Error('格式');
    const ok=await confirmBox('导入这份备份?',
      '将用备份内容<b>替换</b>当前全部数据:'+j.trips.length+' 段旅行、'+j.entries.length+' 篇游记、'+j.photos.length+' 张照片。当前未备份的数据会丢失,建议先导出。','覆盖导入');
    if(!ok)return;
    await idbClear('trips');await idbClear('entries');await idbClear('photos');
    for(const t of j.trips)await idbPut('trips',t);
    for(const e of j.entries)await idbPut('entries',e);
    for(const p of j.photos)await idbPut('photos',p);
    S.trips=j.trips;S.entries=j.entries;S.photos=j.photos;
    S.view='home';S.tripId=null;
    render();toast('导入完成:恢复 '+j.trips.length+' 段旅行');
  }catch(err){
    toast('导入失败:不是有效的备份文件');
  }
});

/* ---------- 启动 ---------- */
(async function init(){
  try{
    db=await openDB();
    S.trips=await idbAll('trips');
    S.entries=await idbAll('entries');
    S.photos=await idbAll('photos');
    render();
  }catch(err){
    $('#app').innerHTML='<div class="empty" style="margin-top:40px">'+icon('compass',46)+
      '<h3>无法打开本地数据库</h3><p>请检查浏览器是否开启了隐私模式或限制了存储,然后刷新重试</p></div>';
  }
})();

if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
</script>
