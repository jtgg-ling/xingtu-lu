        '<div class="field"><label>'+(type==='note'?'见闻与故事':'备注')+'</label><textarea id="f-content" placeholder="'+(type==='note'?'今天看到了什么、遇到了谁……':'有什么要注意的:开放时间、门票、预约方式……')+'">'+esc(e&&e.content||'')+'</textarea></div>'+
        '<div class="field"><label>地点(定位后点亮足迹地图)</label><div class="place-row">'+
          '<input type="text" id="f-place" maxlength="80" value="'+esc(e&&e.placeName||'')+'" placeholder="如:洱海、大理古城">'+
          '<button class="btn btn-g btn-sm" id="f-search">'+icon('search',14)+'</button></div>'+
          '<div class="place-status '+(e&&e.lat!=null?'':'none')+'" id="f-pstatus">'+(e&&e.lat!=null?'已定位 ('+(+e.lat).toFixed(3)+', '+(+e.lng).toFixed(3)+')':'未定位(不影响保存)')+'</div>'+
          '<div class="place-results" id="f-results" hidden></div></div>'+
        '<div class="field"><label>照片</label>'+
          '<button class="btn btn-g btn-sm" id="f-pick">'+icon('camera',14)+'选择照片(可多选)</button>'+
          '<input type="file" id="f-files" accept="image/*" multiple hidden>'+
          '<div class="photo-grid" id="f-grid"></div></div>';
      }else if(type==='transport'){
        const mk=e&&e.mode||'hsr';
        inner+='<div class="field"><label>方式</label><div class="mode-chips" id="f-modes">'+
          MODES.map(x=>'<button type="button" data-m="'+x.k+'" class="'+(x.k===mk?'on':'')+'">'+x.em+' '+x.t+'</button>').join('')+'</div></div>'+
        '<div class="field-row">'+
          '<div class="field"><label>出发地</label><input type="text" id="f-from" maxlength="40" value="'+esc(e&&e.from||'')+'" placeholder="如:上海虹桥"></div>'+
          '<div class="field"><label>到达地</label><input type="text" id="f-to" maxlength="40" value="'+esc(e&&e.to||'')+'" placeholder="如:大理站"></div></div>'+
        '<div class="field-row">'+
          '<div class="field"><label>班次 / 航班号</label><input type="text" id="f-num" maxlength="20" value="'+esc(e&&e.number||'')+'" placeholder="如 G1379 / MU5712"></div>'+
          '<div class="field"><label>座位 / 舱位</label><input type="text" id="f-seat" maxlength="20" value="'+esc(e&&e.seat||'')+'" placeholder="如 05车12F"></div></div>'+
        '<div class="field-row">'+
          '<div class="field"><label>出发时间</label><input type="time" id="f-tdep" value="'+(e&&e.tDepart||'')+'"></div>'+
          '<div class="field"><label>到达时间</label><input type="time" id="f-tarr" value="'+(e&&e.tArrive||'')+'"></div></div>'+
        '<div class="field"><label>备注</label><input type="text" id="f-content" maxlength="120" value="'+esc(e&&e.content||'')+'" placeholder="选填"></div>';
      }else if(type==='hotel'){
        inner+='<div class="field"><label>酒店 / 民宿名称</label><input type="text" id="f-hname" maxlength="60" value="'+esc(e&&(e.name||e.title)||'')+'" placeholder="如:大理海景客栈"></div>'+
        '<div class="field-row">'+
          '<div class="field"><label>入住日期</label><input type="date" id="f-cin" value="'+(e&&e.checkin||defDate)+'"></div>'+
          '<div class="field"><label>离店日期</label><input type="date" id="f-cout" value="'+(e&&e.checkout||'')+'"></div></div>'+
        '<div class="field-row">'+
          '<div class="field"><label>总价(元)</label><input type="number" id="f-price" inputmode="decimal" min="0" value="'+(e&&e.price||'')+'" placeholder="选填"></div>'+
          '<div class="field"><label>城市 / 地址</label><input type="text" id="f-addr" maxlength="60" value="'+esc(e&&e.addr||'')+'" placeholder="选填"></div></div>'+
        '<div class="field"><label>备注</label><input type="text" id="f-content" maxlength="120" value="'+esc(e&&e.content||'')+'" placeholder="确认号、联系方式等,选填"></div>';
      }
      return inner+'<div class="sheet-foot"><button class="btn btn-g" data-cancel>取消</button>'+
        '<button class="btn btn-p" data-ok>'+(e?'保存修改':'添加')+'</button></div>';
    }

    const m=openSheet(
      '<div class="sheet-head"><h3>'+(e?'编辑记录':'添加记录')+'</h3>'+
      '<button class="icon-btn" data-x aria-label="关闭">'+icon('x',16)+'</button></div>'+
      '<div class="type-grid" id="f-types">'+ITYPES.map(x=>
        '<button type="button" data-t="'+x.k+'" class="'+(x.k===curType?'on':'')+'"><span class="em">'+x.em+'</span>'+x.t+'</button>').join('')+'</div>'+
      '<div id="f-form">'+formHtml(curType)+'</div>');

    const sh=m.ov.querySelector('.sheet');
    sh.querySelector('[data-x]').onclick=m.close;

    // 类型切换
    sh.querySelector('#f-types').addEventListener('click',ev=>{
      const b=ev.target.closest('button[data-t]');if(!b)return;
      sh.querySelectorAll('#f-types button').forEach(x=>x.classList.toggle('on',x===b));
      sh.querySelector('#f-form').innerHTML=formHtml(b.dataset.t);
      bindForm(b.dataset.t);
    });

    function bindForm(type){
      const form=sh.querySelector('#f-form');
      form.querySelector('[data-cancel]').onclick=m.close;
      if(type==='place'||type==='food'||type==='note'){
        // 照片编辑草稿
        if(!ED||ED.context!==m){ED={context:m,photoIds:e?e.photoIds.slice():[],newPhotos:[],removedIds:[],lat:e?e.lat:null,lng:e?e.lng:null};}
        const $files=form.querySelector('#f-files'),$grid=form.querySelector('#f-grid');
        function renderGrid(){
          const olds=ED.photoIds.map(pid=>({pid,p:photoById(pid)})).filter(x=>x.p);
          $grid.innerHTML=[...olds.map(x=>'<div class="pg"><img src="'+x.p.dataUrl+'" alt=""><button class="rm" data-old="'+x.pid+'" aria-label="移除">'+icon('x',11)+'</button></div>'),
            ...ED.newPhotos.map((x,i)=>'<div class="pg"><img src="'+x.np.dataUrl+'" alt=""><button class="rm" data-new="'+i+'" aria-label="移除">'+icon('x',11)+'</button></div>')].join('');
          $grid.querySelectorAll('[data-old]').forEach(b=>b.onclick=()=>{ED.photoIds=ED.photoIds.filter(i=>i!==b.dataset.old);ED.removedIds.push(b.dataset.old);renderGrid();});
          $grid.querySelectorAll('[data-new]').forEach(b=>b.onclick=()=>{ED.newPhotos.splice(+b.dataset.new,1);renderGrid();});
        }
        form.querySelector('#f-pick').onclick=()=>$files.click();
        $files.onchange=async()=>{
          const fs=[...$files.files];if(!fs.length)return;
          for(const f of fs){try{ED.newPhotos.push(await compressImage(f));}catch(err){toast('有一张图片读取失败,已跳过');}}
          $files.value='';renderGrid();
        };
        renderGrid();
        // 地点搜索
        const $p=form.querySelector('#f-place'),$st=form.querySelector('#f-pstatus'),$res=form.querySelector('#f-results');
        form.querySelector('#f-search').onclick=async()=>{
          const q=$p.value.trim();
          if(!q){toast('先填写地点名称');$p.focus();return;}
          $res.hidden=true;$st.textContent='正在搜索「'+q+'」……';
          try{
            const list=await geocodePlace(q);
            if(!list.length){$st.textContent='没有找到,换个说法试试,或不定位直接保存';return;}
            $st.textContent='找到 '+list.length+' 个结果,点击选择:';
            $res.innerHTML=list.map((x,i)=>'<button data-i="'+i+'">'+esc(x.name)+'</button>').join('');
            $res.hidden=false;
            $res.querySelectorAll('button').forEach(b=>b.onclick=()=>{
              const x=list[+b.dataset.i];
              ED.lat=x.lat;ED.lng=x.lng;
              $p.value=x.name;
              $st.textContent='已定位 ('+x.lat.toFixed(3)+', '+x.lng.toFixed(3)+')';
              $st.classList.remove('none');$res.hidden=true;
            });
          }catch(err){$st.textContent='定位服务暂时连不上,可先保存,不影响其他功能';}
        };
      }
      form.querySelector('[data-ok]').onclick=()=>saveItem(type);
    }

    async function saveItem(type){
      const form=sh.querySelector('#f-form');
      const date=form.querySelector('#f-date').value;
      if(!date){toast('选择日期');return;}
      const obj=e?Object.assign({},e):{id:uid(),tripId,createdAt:Date.now()};
      obj.type=type;obj.date=date;
      if(type==='transport'){
        const modeBtn=form.querySelector('#f-modes button.on');
        obj.mode=modeBtn?modeBtn.dataset.m:'hsr';
        obj.from=form.querySelector('#f-from').value.trim();
        obj.to=form.querySelector('#f-to').value.trim();
        obj.number=form.querySelector('#f-num').value.trim();
        obj.seat=form.querySelector('#f-seat').value.trim();
        obj.tDepart=form.querySelector('#f-tdep').value||null;
        obj.tArrive=form.querySelector('#f-tarr').value||null;
        obj.content=form.querySelector('#f-content').value.trim();
        if(!obj.from&&!obj.to&&!obj.number){toast('填一下出发地/到达地或班次');return;}
        delete obj.title;delete obj.placeName;delete obj.lat;delete obj.lng;delete obj.photoIds;delete obj.time;
      }else if(type==='hotel'){
        obj.name=form.querySelector('#f-hname').value.trim();
        obj.checkin=form.querySelector('#f-cin').value||date;
        obj.checkout=form.querySelector('#f-cout').value||null;
        obj.price=form.querySelector('#f-price').value?+form.querySelector('#f-price').value:null;
        obj.addr=form.querySelector('#f-addr').value.trim();
        obj.content=form.querySelector('#f-content').value.trim();
        if(!obj.name){toast('填一下酒店名称');return;}
        delete obj.title;delete obj.placeName;delete obj.lat;delete obj.lng;delete obj.photoIds;delete obj.time;
      }else{
        obj.time=form.querySelector('#f-time').value||null;
        obj.title=form.querySelector('#f-title').value.trim();
        obj.content=form.querySelector('#f-content').value.trim();
        obj.placeName=form.querySelector('#f-place').value.trim()||null;
        obj.lat=ED?ED.lat:null;obj.lng=ED?ED.lng:null;
        // 照片处理
        for(const pid of ED.removedIds){const p=photoById(pid);if(p){await idbDel('photos',pid);S.photos=S.photos.filter(x=>x.id!==pid);}}
        const newIds=[];
        for(const np of ED.newPhotos){
          const ph={id:uid(),tripId,entryId:null,dataUrl:np.dataUrl,w:np.w,h:np.h};
          newIds.push(ph.id);S.photos.push(ph);await idbPut('photos',ph);
        }
        obj.photoIds=[...ED.photoIds,...newIds];
        if(!obj.title&&!obj.content&&!obj.placeName&&!obj.photoIds.length){toast('写点什么,或放一张照片吧');return;}
        newIds.forEach(nid=>{const p=photoById(nid);if(p)p.entryId=obj.id;});
      }
      obj.updatedAt=Date.now();
      /* 有定位 → 反查省市/国家归属(点亮地图用) */
      if(obj.lat!=null&&obj.lng!=null&&(!e||e.lat!==obj.lat||e.lng!==obj.lng||!e.cc)){
        try{const rg=await reverseGeo(obj.lat,obj.lng);
          if(rg&&rg.cc){obj.cc=rg.cc;obj.cName=rg.cName;obj.prov=rg.prov;obj.city=rg.city;}
        }catch(err){}
      }
      await idbPut('entries',obj);
      if(!e)S.entries.push(obj);
      ED=null;
      m.close();toast('已保存');
      render();
    }
    bindForm(curType);
  },

  async delItem(id){
    const e=entryById(id);if(!e)return;
    const ps=photosOfEntry(id);
    const ok=await confirmBox('删除这条记录?',(e.title||itype(e.type).t)+(ps.length?' 与它的 '+ps.length+' 张照片':'')+' 将被删除。');
    if(!ok)return;
    for(const p of ps)await idbDel('photos',p.id);
    await idbDel('entries',id);
    S.photos=S.photos.filter(p=>p.entryId!==id);
    S.entries=S.entries.filter(x=>x.id!==id);
    render();toast('已删除');
  },

  /* ---- 相册直传 ---- */
  albumUpload(tripId){
    const t=tripById(tripId);if(!t)return;
    const draft={photos:[],date:t.endDate&&todayStr()>t.endDate?t.endDate:clampDate(todayStr(),t.startDate,t.endDate)||todayStr()};
    const m=openSheet(
      '<div class="sheet-head"><h3>添加照片</h3><button class="icon-btn" data-x aria-label="关闭">'+icon('x',16)+'</button></div>'+
      '<div class="field"><label>拍摄日期</label><input type="date" id="f-date" value="'+draft.date+'"></div>'+
      '<div class="field"><label>照片</label>'+
        '<button class="btn btn-g btn-sm" id="f-pick">'+icon('camera',14)+'选择照片(可多选)</button>'+
        '<input type="file" id="f-files" accept="image/*" multiple hidden>'+
        '<div class="photo-grid" id="f-grid"></div></div>'+
      '<div class="sheet-foot"><button class="btn btn-g" data-cancel>取消</button><button class="btn btn-p" data-ok>保存</button></div>');
    m.ov.querySelector('[data-x]').onclick=m.close;
    m.ov.querySelector('[data-cancel]').onclick=m.close;
    const $files=m.ov.querySelector('#f-files'),$grid=m.ov.querySelector('#f-grid');
    function renderGrid(){
      $grid.innerHTML=draft.photos.map((x,i)=>'<div class="pg"><img src="'+x.dataUrl+'" alt=""><button class="rm" data-i="'+i+'" aria-label="移除">'+icon('x',11)+'</button></div>').join('');
      $grid.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{draft.photos.splice(+b.dataset.i,1);renderGrid();});
    }
    m.ov.querySelector('#f-pick').onclick=()=>$files.click();
    $files.onchange=async()=>{
      const fs=[...$files.files];if(!fs.length)return;
      for(const f of fs){try{draft.photos.push(await compressImage(f));}catch(err){toast('有一张图片读取失败,已跳过');}}
      $files.value='';renderGrid();
    };
    m.ov.querySelector('[data-ok]').onclick=async()=>{
      const date=m.ov.querySelector('#f-date').value||todayStr();
      if(!draft.photos.length){toast('先选几张照片');return;}
      const obj={id:uid(),tripId,date,type:'note',title:'',content:'',placeName:null,lat:null,lng:null,photoIds:[],createdAt:Date.now()};
      for(const np of draft.photos){
        const ph={id:uid(),tripId,entryId:obj.id,dataUrl:np.dataUrl,w:np.w,h:np.h};
        obj.photoIds.push(ph.id);S.photos.push(ph);await idbPut('photos',ph);
      }
      S.entries.push(obj);await idbPut('entries',obj);
      m.close();toast('已添加 '+draft.photos.length+' 张照片');
      render();
    };
  },

  /* ---- 花销 ---- */
  expSheet(tripId,expId){
    const t=tripById(tripId);if(!t)return;
    const x=expId?S.expenses.find(v=>v.id===expId):null;
    const defDate=x?x.date:(t.endDate&&todayStr()>t.endDate?t.endDate:clampDate(todayStr(),t.startDate,t.endDate)||todayStr());
    const m=openSheet(
      '<div class="sheet-head"><h3>'+(x?'编辑花销':'记一笔')+'</h3>'+
      '<button class="icon-btn" data-x aria-label="关闭">'+icon('x',16)+'</button></div>'+
      '<div class="field"><label>日期</label><input type="date" id="f-date" value="'+defDate+'"></div>'+
      '<div class="field"><label>分类</label><div class="type-grid" id="f-cats" style="grid-template-columns:repeat(4,1fr)">'+
        CATS.map(c=>'<button type="button" data-k="'+c.k+'" class="'+((x?x.category:'food')===c.k?'on':'')+'"><span class="em">'+c.em+'</span>'+c.t+'</button>').join('')+'</div></div>'+
      '<div class="field"><label>金额(元) <em>*</em></label><input type="number" id="f-amt" inputmode="decimal" min="0" step="0.01" value="'+(x?x.amount:'')+'" placeholder="0.00"></div>'+
      '<div class="field"><label>备注</label><input type="text" id="f-note" maxlength="60" value="'+esc(x&&x.note||'')+'" placeholder="如:两张门票"></div>'+
      '<div class="sheet-foot"><button class="btn btn-g" data-cancel>取消</button>'+
      '<button class="btn btn-p" data-ok>'+(x?'保存修改':'记一笔')+'</button></div>');
    m.ov.querySelector('[data-x]').onclick=m.close;
    m.ov.querySelector('[data-cancel]').onclick=m.close;
    m.ov.querySelector('#f-cats').addEventListener('click',ev=>{
      const b=ev.target.closest('button[data-k]');if(!b)return;
      m.ov.querySelectorAll('#f-cats button').forEach(v=>v.classList.toggle('on',v===b));
    });
    m.ov.querySelector('[data-ok]').onclick=async()=>{
      const amt=m.ov.querySelector('#f-amt').value;
      if(!amt||+amt<0){toast('填一下金额');return;}
      const catBtn=m.ov.querySelector('#f-cats button.on');
      const obj=x?Object.assign({},x):{id:uid(),tripId,createdAt:Date.now()};
      obj.date=m.ov.querySelector('#f-date').value||defDate;
      obj.category=catBtn?catBtn.dataset.k:'other';
      obj.amount=+amt;obj.note=m.ov.querySelector('#f-note').value.trim();
      await idbPut('expenses',obj);
      if(!x)S.expenses.push(obj);
      m.close();toast('已记账 '+money(obj.amount));
      render();
    };
  },

  budgetSheet(tripId){
    const t=tripById(tripId);if(!t)return;
    const m=openSheet(
      '<div class="sheet-head"><h3>旅行预算</h3><button class="icon-btn" data-x aria-label="关闭">'+icon('x',16)+'</button></div>'+
      '<div class="field"><label>预算金额(元,留空则清除)</label><input type="number" id="f-b" inputmode="decimal" min="0" value="'+(t.budget||'')+'" placeholder="如:5000"></div>'+
      '<div class="sheet-foot"><button class="btn btn-g" data-cancel>取消</button><button class="btn btn-p" data-ok>保存</button></div>');
    m.ov.querySelector('[data-x]').onclick=m.close;
    m.ov.querySelector('[data-cancel]').onclick=m.close;
    m.ov.querySelector('[data-ok]').onclick=async()=>{
      const v=m.ov.querySelector('#f-b').value;
      t.budget=v?+v:null;
      await idbPut('trips',t);
      m.close();render();toast(t.budget?'预算 '+money(t.budget):'已清除预算');
    };
  },

  /* ---- 清单 ---- */
  async addCk(tripId){
    const $t=$('#ck-text');const text=$t.value.trim();
    if(!text){toast('先输入内容');$t.focus();return;}
    const c={id:uid(),tripId,text,done:false,createdAt:Date.now()};
    S.checklist.push(c);await idbPut('checklist',c);
    render();
    const nt=$('#ck-text');if(nt)nt.focus();
  },
  async toggleCk(id){
    const c=S.checklist.find(x=>x.id===id);if(!c)return;
    c.done=!c.done;await idbPut('checklist',c);render();
  },
  async delCk(id){
    await idbDel('checklist',id);
    S.checklist=S.checklist.filter(x=>x.id!==id);render();
  },

  /* ---- 导出 / 导入 ---- */
  async doExport(){
    if(!S.trips.length&&!S.photos.length){toast('还没有内容可以备份');return;}
    const data={app:'footprints',version:2,exportedAt:new Date().toISOString(),
      trips:S.trips,entries:S.entries,photos:S.photos,expenses:S.expenses,checklist:S.checklist};
    const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    const d=new Date();
    a.download='行途录备份_'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'.json';
    a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast('备份文件已导出');
  },
  doImport(){$('#import-file').click();},

  async clearAll(){
    const ok=await confirmBox('清空全部数据?','所有旅行、记录、照片、花销与清单都会被删除,且无法恢复。强烈建议先导出备份。','确认清空');
    if(!ok)return;
    for(const s of['trips','entries','photos','expenses','checklist'])await idbClear(s);
    S.trips=[];S.entries=[];S.photos=[];S.expenses=[];S.checklist=[];
    S.view='home';S.tripId=null;
    render();toast('已清空全部数据');
  },
};

/* 导入处理(兼容 v1 / v2 备份) */
$('#import-file').addEventListener('change',async ev=>{
  const f=ev.target.files[0];ev.target.value='';
  if(!f)return;
  try{
    const j=JSON.parse(await f.text());
    if(!j||!Array.isArray(j.trips)||!Array.isArray(j.entries)||!Array.isArray(j.photos))throw new Error('格式');
    const exps=Array.isArray(j.expenses)?j.expenses:[],cks=Array.isArray(j.checklist)?j.checklist:[];
    const ok=await confirmBox('导入这份备份?',
      '将用备份内容<b>替换</b>当前全部数据:'+j.trips.length+' 段旅行、'+j.entries.length+' 条记录、'+j.photos.length+' 张照片、'+exps.length+' 笔花销。当前未备份的数据会丢失,建议先导出。','覆盖导入');
    if(!ok)return;
    for(const s of['trips','entries','photos','expenses','checklist'])await idbClear(s);
    for(const t of j.trips)await idbPut('trips',t);
    for(const e of j.entries){if(OLD_TYPE_MAP[e.type])e.type=OLD_TYPE_MAP[e.type];await idbPut('entries',e);}
    for(const p of j.photos)await idbPut('photos',p);
    for(const x of exps)await idbPut('expenses',x);
    for(const c of cks)await idbPut('checklist',c);
    S.trips=j.trips;S.entries=j.entries;S.photos=j.photos;S.expenses=exps;S.checklist=cks;
    S.entries.forEach(e=>{if(OLD_TYPE_MAP[e.type])e.type=OLD_TYPE_MAP[e.type];});
    S.view='home';S.tripId=null;
    render();toast('导入完成:恢复 '+j.trips.length+' 段旅行');
  }catch(err){
    toast('导入失败:不是有效的备份文件');
  }
});

/* ---------- 启动 ---------- */
(async function init(){
  try{
    db=await openDB();
    S.trips=await idbAll('trips');
    S.entries=await idbAll('entries');
    S.photos=await idbAll('photos');
    S.expenses=await idbAll('expenses');
    S.checklist=await idbAll('checklist');
    // 旧版类型迁移(见闻/趣事/心情→note 等)
    let migrated=false;
    for(const e of S.entries){if(OLD_TYPE_MAP[e.type]){e.type=OLD_TYPE_MAP[e.type];migrated=true;await idbPut('entries',e);}}
    render();
    persistStorage();
  }catch(err){
    $('#app').innerHTML='<div class="empty" style="margin-top:40px">'+icon('compass',46)+
      '<h3>无法打开本地数据库</h3><p>请检查浏览器是否开启了隐私模式或限制了存储,然后刷新重试</p></div>';
  }
})();

if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
</script>
