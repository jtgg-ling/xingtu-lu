<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>行途录 · 旅行记录</title>
<link rel="icon" href="icons/icon-192.png">
<meta name="theme-color" content="#2f7cf6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="行途录">
<style>
:root{
  --paper:#eef4ff;--card:#ffffff;--ink:#12264f;--ink2:#5b7195;--ink3:#93a5c4;
  --line:#e3ecfa;--line2:#cfdef5;--accent:#2f7cf6;--accent2:#38bdf8;
  --moss:#10b981;--gold:#ffb020;--danger:#a8402a;
  --shadow:0 1px 3px rgba(37,99,235,.06),0 8px 24px -10px rgba(37,99,235,.16);
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --serif:'Segoe UI','PingFang SC','Microsoft YaHei',serif;
  --tabbar-h:58px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.65;min-height:100vh}
button{font-family:inherit;touch-action:manipulation}
img{display:block}
::selection{background:rgba(47,124,246,.22)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea,select{font-size:16px}/* 防 iOS 聚焦缩放 */

/* ===== 顶栏 ===== */
.topbar{position:sticky;top:0;z-index:900;background:rgba(238,244,255,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:600px;margin:0 auto;padding:0 16px;height:54px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.logo svg{color:var(--accent)}
.logo b{font-family:var(--serif);font-size:20px;font-weight:700;letter-spacing:2px}
.logo span{font-size:10px;color:var(--ink3);letter-spacing:2px;margin-top:4px}
.tb-back{width:36px;height:36px;border:0;background:none;color:var(--ink2);cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:10px;flex:none}
.tb-back:active{background:rgba(47,124,246,.1)}
.tb-title{font-family:var(--serif);font-size:17px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-act{border:0;background:none;color:var(--accent);font-size:14px;cursor:pointer;padding:8px 4px;flex:none;font-weight:600}

/* ===== 布局 ===== */
.wrap{max-width:600px;margin:0 auto;padding:18px 16px calc(var(--tabbar-h) + 38px + env(safe-area-inset-bottom))}
.view-anim{animation:fadeUp .35s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.boot{display:flex;align-items:center;justify-content:center;min-height:60vh;color:var(--ink3);letter-spacing:3px}

/* ===== 底部导航 ===== */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:900;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;padding:5px 6px calc(5px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;border:0;background:none;cursor:pointer;color:var(--ink3);font-size:10.5px;letter-spacing:1px;padding:6px 0 3px;border-radius:12px;transition:color .15s}
.tabbar button.on{color:var(--accent);font-weight:600}
.tabbar button:active{background:rgba(47,124,246,.06)}

/* ===== 通用组件 ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;cursor:pointer;font-size:14.5px;padding:11px 18px;border:1px solid transparent;line-height:1.4;transition:all .15s;user-select:none;white-space:nowrap}
.btn-p{background:linear-gradient(135deg,#2f7cf6,#38bdf8);color:#fff;box-shadow:0 4px 14px -4px rgba(47,124,246,.55);font-weight:600}
.btn-p:active{transform:scale(.97)}
.btn-g{background:var(--card);border-color:var(--line2);color:var(--ink)}
.btn-t{background:none;color:var(--accent);padding:8px 10px}
.btn-d{background:#fbeeec;color:#a8402a;border-color:#ecd2cc}
.btn-sm{padding:7px 13px;font-size:13px;border-radius:10px}
.btn-blk{width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.empty{text-align:center;padding:52px 20px;color:var(--ink2);background:var(--card);border:1.5px dashed var(--line2);border-radius:16px}
.empty svg{color:var(--line2);margin-bottom:12px}
.empty h3{font-family:var(--serif);font-size:18px;font-weight:700;color:var(--ink);margin-bottom:5px}
.empty p{font-size:13.5px;margin-bottom:18px}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 13px}
.sec h2{font-family:var(--serif);font-size:18px;font-weight:700}
.sec span{font-size:12.5px;color:var(--ink3)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--ink2);background:rgba(47,124,246,.07);border:1px solid rgba(47,124,246,.18);border-radius:99px;padding:3px 10px;white-space:nowrap}
.icon-btn{width:34px;height:34px;border-radius:10px;border:0;cursor:pointer;background:rgba(255,255,255,.92);color:var(--ink2);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(37,99,235,.18);flex:none}
.icon-btn.del{color:#a8402a}
.icon-btn:active{transform:scale(.92)}

/* ===== 首页 ===== */
.hello{margin-bottom:20px}
.hello .kicker{font-size:11px;letter-spacing:4px;color:var(--accent);margin-bottom:4px}
.hello h1{font-family:var(--serif);font-size:25px;font-weight:800;letter-spacing:.5px}
.hello p{color:var(--ink2);font-size:13.5px;margin-top:3px}
.stat-strip{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin-bottom:22px}
.stat-strip::-webkit-scrollbar{display:none}
.stat-pill{flex:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 16px;box-shadow:var(--shadow);min-width:88px}
.stat-pill .n{font-family:var(--serif);font-size:21px;font-weight:800;line-height:1.2;background:linear-gradient(135deg,#2f7cf6,#38bdf8);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat-pill .n small{font-size:12px;color:var(--ink2);font-weight:400;-webkit-text-fill-color:var(--ink2);margin-left:1px}
.stat-pill .l{font-size:11px;color:var(--ink3);letter-spacing:1.5px}
.memory-card{display:flex;gap:14px;align-items:center;cursor:pointer;background:linear-gradient(120deg,#fff,#eaf3ff);border:1px solid #d5e5fc;border-radius:16px;padding:13px;margin-bottom:24px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.memory-card::before{content:"回忆";position:absolute;right:10px;top:8px;writing-mode:vertical-rl;font-size:10px;letter-spacing:4px;color:rgba(47,124,246,.3)}
.memory-card .mc-img{width:76px;height:76px;flex:none;border-radius:12px;overflow:hidden;background:#e3eefc}
.memory-card .mc-img img{width:100%;height:100%;object-fit:cover}
.memory-card .mc-body{flex:1;min-width:0}
.memory-card .mc-tag{font-size:11px;color:var(--accent);letter-spacing:1.5px}
.memory-card h3{font-family:var(--serif);font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.memory-card .mc-meta{font-size:11.5px;color:var(--ink3)}
.trip-row{display:flex;gap:13px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px;box-shadow:var(--shadow);cursor:pointer;position:relative;transition:transform .15s}
.trip-row:active{transform:scale(.985)}
.trip-cover{width:86px;height:86px;border-radius:12px;overflow:hidden;flex:none;background:linear-gradient(135deg,#dbeafe,#93c5fd);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:34px;color:rgba(30,99,212,.45)}
.trip-cover img{width:100%;height:100%;object-fit:cover}
.trip-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px;padding-right:2px}
.trip-info h3{font-family:var(--serif);font-size:16.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trip-info .dest{font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden}
.trip-info .dest svg{color:var(--accent);flex:none}
.trip-info .meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
.trip-row .ops{position:absolute;top:8px;right:8px;display:flex;gap:4px}
.trip-row .ops .icon-btn{width:28px;height:28px;border-radius:8px}
.trip-status{font-size:10.5px;letter-spacing:1px;border-radius:99px;padding:1.5px 8px;font-weight:600}
.st-doing{background:#e5f8f0;color:#06886b}
.st-todo{background:#fff4e0;color:#a36a00}
.st-done{background:#eef2f8;color:var(--ink3)}

/* ===== FAB ===== */
.fab{position:fixed;right:16px;bottom:calc(var(--tabbar-h) + 22px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;border:0;cursor:pointer;background:linear-gradient(135deg,#2f7cf6,#38bdf8);color:#fff;box-shadow:0 10px 26px -6px rgba(47,124,246,.6);display:flex;align-items:center;justify-content:center;z-index:880;transition:transform .15s}
.fab:active{transform:scale(.92)}

/* ===== 旅行详情 ===== */
.trip-hero{position:relative;border-radius:18px;overflow:hidden;min-height:172px;display:flex;align-items:flex-end;box-shadow:var(--shadow);background:linear-gradient(135deg,#2f7cf6,#38bdf8)}
.trip-hero .cover-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.trip-hero .veil{position:absolute;inset:0;background:linear-gradient(to top,rgba(12,32,74,.75) 0%,rgba(12,32,74,.25) 55%,rgba(12,32,74,.08))}
.trip-hero .th-body{position:relative;z-index:2;padding:18px;color:#fff;width:100%}
.trip-hero h1{font-family:var(--serif);font-size:23px;font-weight:800;margin-bottom:4px}
.trip-hero .th-sub{display:flex;flex-wrap:wrap;gap:5px 14px;font-size:12.5px;opacity:.95;align-items:center}
.trip-hero .th-sub .it{display:inline-flex;align-items:center;gap:5px}
.trip-hero .ops{position:absolute;top:12px;right:12px;z-index:3;display:flex;gap:6px}
.trip-days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:14px 0 4px}
.trip-days::-webkit-scrollbar{display:none}
.trip-days .chip{flex:none;background:var(--card);box-shadow:var(--shadow)}
.trip-tabs{display:flex;gap:6px;margin:14px 0 18px;overflow-x:auto;scrollbar-width:none;position:sticky;top:54px;z-index:800;background:linear-gradient(var(--paper) 82%,transparent);padding:4px 0 8px;margin-top:10px}
.trip-tabs::-webkit-scrollbar{display:none}
.trip-tabs button{flex:none;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);background:var(--card);color:var(--ink2);border-radius:99px;padding:8px 15px;font-size:13.5px;cursor:pointer;transition:all .15s}
.trip-tabs button .cnt{font-size:10.5px;background:rgba(47,124,246,.12);color:var(--accent);border-radius:99px;padding:0 6px}
.trip-tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.trip-tabs button.on .cnt{background:rgba(255,255,255,.25);color:#fff}
.add-bar{display:flex;gap:8px;margin-bottom:16px}
.add-bar .btn{flex:1}

/* 日程 */
.day-h{display:flex;align-items:center;gap:9px;margin:20px 0 10px}
.day-h:first-child{margin-top:2px}
.day-h .dn{background:var(--accent);color:#fff;font-weight:700;border-radius:9px;padding:3px 9px;font-size:12px;letter-spacing:.5px;flex:none}
.day-h .dd{color:var(--ink2);font-size:12.5px;flex:none}
.day-h .ln{flex:1;border-top:1.5px dashed var(--line2)}
.day-add{width:100%;border:1.5px dashed var(--line2);background:rgba(255,255,255,.55);color:var(--ink3);border-radius:12px;padding:9px;font-size:13px;cursor:pointer;margin-bottom:8px}
.day-add:active{border-color:var(--accent);color:var(--accent)}
.itm{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:10px;box-shadow:var(--shadow);position:relative}
.itm-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.itm-head h3{font-family:var(--serif);font-size:15.5px;font-weight:700;flex:1;min-width:0;line-height:1.45}
.tchip{flex:none;font-size:10.5px;letter-spacing:1px;padding:2px 8px;border-radius:99px;color:#fff;background:var(--tc,var(--accent))}
.itm .time-chip{flex:none;font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.itm-content{color:var(--ink);font-size:14px;white-space:pre-wrap;word-break:break-word;margin-top:2px}
.itm-place{display:inline-flex;align-items:center;gap:4px;margin-top:8px;font-size:12px;color:var(--ink2);background:rgba(47,124,246,.07);border:1px solid rgba(47,124,246,.18);border-radius:99px;padding:2.5px 10px}
.itm-place svg{color:var(--accent);flex:none}
.itm-ops{display:flex;gap:4px}
.itm-ops .icon-btn{width:28px;height:28px;border-radius:8px;box-shadow:none;background:rgba(47,124,246,.06)}
.itm-photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.itm-photos .ep{aspect-ratio:1;border-radius:9px;overflow:hidden;background:#e3eefc;cursor:pointer}
.itm-photos .ep img{width:100%;height:100%;object-fit:cover}
/* 交通卡 */
.tr-head{display:flex;align-items:center;gap:10px}
.tr-emo{font-size:26px;flex:none;line-height:1}
.tr-route{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.tr-pt{min-width:0}
.tr-pt .lab{font-size:10px;color:var(--ink3);letter-spacing:1px}
.tr-pt .val{font-family:var(--serif);font-size:15.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-arrow{color:var(--accent);flex:none;display:flex}
.tr-mid{text-align:center}
.tr-mid .num{font-size:11px;color:var(--ink2);background:rgba(47,124,246,.08);border-radius:99px;padding:1px 8px;white-space:nowrap}
.tr-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.tr-meta .chip{font-size:11px}
/* 住宿卡 */
.ht-head{display:flex;align-items:center;gap:10px}
.ht-emo{font-size:24px;flex:none}
.ht-name{font-family:var(--serif);font-size:15.5px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ht-nights{font-size:11.5px;color:var(--moss);background:#e5f8f0;border-radius:99px;padding:2px 9px;flex:none}
.ht-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;align-items:center}
/* 记录类型选择 */
.type-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:6px 0 4px}
.type-grid button{border:1.5px solid var(--line2);background:#fff;border-radius:13px;padding:10px 2px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--ink2);transition:all .15s}
.type-grid button .em{font-size:21px;line-height:1.2}
.type-grid button.on{border-color:var(--accent);background:rgba(47,124,246,.07);color:var(--accent);font-weight:600}

/* 花销 */
.budget-card{padding:16px;margin-bottom:14px}
.budget-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.budget-top .big{font-family:var(--serif);font-size:28px;font-weight:800;background:linear-gradient(135deg,#2f7cf6,#38bdf8);-webkit-background-clip:text;background-clip:text;color:transparent}
.budget-top .big small{font-size:14px}
.budget-top .rest{font-size:12.5px;color:var(--ink2)}
.budget-bar{height:8px;border-radius:99px;background:rgba(47,124,246,.1);overflow:hidden;margin:12px 0 8px}
.budget-bar i{display:block;height:100%;background:linear-gradient(90deg,#38bdf8,#2f7cf6);border-radius:99px;transition:width .5s}
.budget-bar i.over{background:linear-gradient(90deg,#fb923c,#ef4444)}
.budget-foot{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink3)}
.cat-bars{padding:15px 16px;margin-bottom:14px}
.cat-bars h3{font-size:13.5px;font-weight:700;margin-bottom:11px;display:flex;align-items:center;gap:6px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.bar-row .bl{width:44px;font-size:12.5px;color:var(--ink2);flex:none;display:flex;align-items:center;gap:3px}
.bar-row .bar{flex:1;height:16px;background:rgba(47,124,246,.08);border-radius:6px;overflow:hidden}
.bar-row .bar i{display:block;height:100%;border-radius:6px;background:var(--bc,var(--accent));transition:width .5s}
.bar-row .bn{width:76px;font-size:12px;color:var(--ink2);text-align:right;flex:none;font-variant-numeric:tabular-nums}
.exp-row{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:10px 13px;margin-bottom:8px;box-shadow:var(--shadow);cursor:pointer}
.exp-emo{width:38px;height:38px;border-radius:11px;background:rgba(47,124,246,.07);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.exp-mid{flex:1;min-width:0}
.exp-mid .c{font-size:14px;font-weight:600}
.exp-mid .n{font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp-amt{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;flex:none}
.exp-day{font-size:12px;color:var(--ink3);margin:14px 0 8px;display:flex;align-items:center;gap:8px}
.exp-day::after{content:"";flex:1;border-top:1px dashed var(--line2)}

/* 相册 */
.album-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.album-grid .ag{aspect-ratio:1;border-radius:10px;overflow:hidden;background:#e3eefc;cursor:pointer;position:relative}
.album-grid .ag img{width:100%;height:100%;object-fit:cover}
.album-grid .ag .day-tag{position:absolute;left:5px;bottom:5px;font-size:9.5px;color:#fff;background:rgba(12,32,74,.55);border-radius:6px;padding:1px 6px}

/* 清单 */
.ck-input{display:flex;gap:8px;margin-bottom:14px}
.ck-input input{flex:1;border:1px solid var(--line2);border-radius:12px;padding:10px 13px;background:#fff;color:var(--ink)}
.ck-input input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,124,246,.12)}
.ck-row{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px 13px;margin-bottom:8px;box-shadow:var(--shadow)}
.ck-box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line2);background:#fff;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;padding:0}
.ck-row.done .ck-box{background:var(--moss);border-color:var(--moss)}
.ck-txt{flex:1;min-width:0;font-size:14.5px;word-break:break-word}
.ck-row.done .ck-txt{color:var(--ink3);text-decoration:line-through}
.ck-prog{font-size:12px;color:var(--ink3);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.ck-prog .bar{flex:1;height:6px;background:rgba(16,185,129,.12);border-radius:99px;overflow:hidden}
.ck-prog .bar i{display:block;height:100%;background:var(--moss);border-radius:99px;transition:width .4s}

/* ===== 地图 / 回顾 ===== */
.map-box{height:56vh;min-height:340px;border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);background:#e3eefc;position:relative;z-index:1}
.map-note{font-size:12px;color:var(--ink3);margin-top:10px;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.map-fallback{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--ink3);font-size:13.5px;text-align:center;padding:20px}
.place-list{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
.place-list .pl{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink2);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 11px}
.place-list .pl i{width:7px;height:7px;border-radius:50%;background:var(--pc,var(--accent));flex:none}
.leaflet-container{font-family:var(--sans)}
.leaflet-popup-content-wrapper{border-radius:10px}
.leaflet-popup-content{margin:10px 14px;font-size:12.5px;line-height:1.6}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 17px;box-shadow:var(--shadow)}
.stat-card .n{font-family:var(--serif);font-size:25px;font-weight:800;line-height:1.2;background:linear-gradient(135deg,#2f7cf6,#38bdf8);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat-card .n small{font-size:13px;color:var(--ink2);font-weight:400;-webkit-text-fill-color:var(--ink2)}
.stat-card .l{font-size:11.5px;color:var(--ink3);letter-spacing:1.5px;margin-top:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.panel h3{font-family:var(--serif);font-size:15.5px;font-weight:700;margin-bottom:13px;display:flex;align-items:center;gap:7px}
.panel h3 svg{color:var(--accent)}

/* ===== 我的 ===== */
.me-card{padding:18px;margin-bottom:14px}
.me-card .row-line{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.me-card .row-line:last-child{border-bottom:0}
.me-card .row-line b{font-family:var(--serif)}
.me-card .row-line span{color:var(--ink2)}
.me-list{overflow:hidden;margin-bottom:14px}
.me-row{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;background:var(--card);border:0;border-bottom:1px solid var(--line);cursor:pointer;font-size:14.5px;color:var(--ink);text-align:left}
.me-row:last-child{border-bottom:0}
.me-row:active{background:rgba(47,124,246,.05)}
.me-row .em{font-size:19px;flex:none}
.me-row .sub{display:block;font-size:11.5px;color:var(--ink3);font-weight:400}
.me-row .arrow{margin-left:auto;color:var(--line2);display:flex;flex:none}
.me-row.danger{color:var(--danger)}
.tip-card{background:linear-gradient(120deg,#eaf3ff,#f0fbff);border:1px solid #d5e5fc;border-radius:15px;padding:14px 16px;font-size:12.5px;color:var(--ink2);line-height:1.8}

/* 回顾页迷你旅行行 + 之最 */
.trip-row.mini{padding:10px 12px;margin-bottom:9px;box-shadow:none}
.trip-row.mini .trip-cover{width:56px;height:56px;border-radius:10px;font-size:22px}
.trip-row.mini h3{font-size:15px}
.trip-row.mini .trip-info{gap:1px}
.sup-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line)}
.sup-row:last-child{border-bottom:0}
.sup-row .em{font-size:21px;flex:none}
.sup-row .lab{width:80px;font-size:12.5px;color:var(--ink3);flex:none}
.sup-row .val{flex:1;min-width:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.sup-row .num{color:var(--accent);font-variant-numeric:tabular-nums;flex:none;font-size:13px;font-weight:600}
/* 点亮地图 */
.light-card{background:linear-gradient(180deg,#0e1a36,#0a1226);border-radius:20px;padding:20px 14px 16px;box-shadow:var(--shadow);margin-bottom:8px;color:#dbe7ff}
.lg-stats{text-align:center;font-size:13px;color:#9fb6e8;margin-bottom:13px;line-height:1.6}
.lg-stats b{color:#fff;font-family:var(--serif);font-size:19px;margin:0 3px}
.lg-toggle{display:flex;gap:9px;justify-content:center;margin-bottom:13px}
.lg-toggle button{border:1px solid #2a3c66;background:#111d3a;color:#9fb6e8;border-radius:99px;padding:5px 20px;font-size:13px;cursor:pointer}
.lg-toggle button.on{background:#2f6ef6;border-color:#2f6ef6;color:#fff;font-weight:600}
.lg-map{height:330px;border-radius:14px;overflow:hidden;background:#0d1830;position:relative}
.lg-map.leaflet-container{background:#0d1830}
.lg-map .leaflet-container{background:#0d1830;font:inherit}
.lg-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#5f739f;font-size:13px;letter-spacing:1px}
.lg-crumb{display:flex;align-items:center;justify-content:center;gap:11px;margin-top:13px;font-size:13px;color:#cfe0ff}
.lg-crumb button{background:#152242;border:1px solid #22325a;color:#9fc0ff;border-radius:99px;padding:4px 13px;font-size:12px;cursor:pointer}
.lg-crumb b{color:#fff}
.lg-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px;justify-content:center}
.lg-chip{font-size:11.5px;padding:4px 11px;border-radius:99px;background:#152242;color:#5f739f;border:1px solid #22325a}
.lg-chip.lit{background:#1d4ed8;color:#fff;border-color:#4f8bff;font-weight:600;cursor:pointer}
.lg-hint{margin-top:12px;text-align:center;font-size:11px;color:#5f739f}
.lg-pin .fp-dot{width:14px;height:14px;border-width:2px}
.lg-pin .fp-halo{width:18px;height:18px;left:0;top:-2px}
.lg-pin .fp-tip{top:10px;width:7px;height:7px;margin-left:-4.5px;border-width:2px}
.lg-pin{width:14px;height:20px}
/* 每日速览 */
.ov-panel .ov-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.ov-panel .ov-row:last-child{border-bottom:0}
.ov-row .ov-d{flex:none;font-family:var(--serif);font-weight:800;color:var(--accent);font-size:13px;min-width:32px}
.ov-row .ov-p{flex:1;min-width:0;font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov-row .ov-n{flex:none;font-size:11px;color:var(--ink3)}
/* 分享图轮播 */
.sc-carousel{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 12px}
.sc-item{flex:0 0 78%;scroll-snap-align:center}
.sc-item img{width:100%;border-radius:14px;box-shadow:var(--shadow);display:block}
.sc-lab{font-size:12px;color:var(--ink3);margin:9px 2px 8px;text-align:center;letter-spacing:1px}
.sc-item .btn{display:block;margin:0 auto}

/* 足迹点亮标记(高德/百度风格:光晕脉冲钉 + 地名标签) */
.fp-wrap{background:none;border:0}
.fp-pin{position:relative;width:28px;height:58px}
.fp-halo{position:absolute;left:1px;top:0;width:26px;height:26px;border-radius:50%;background:var(--pc);opacity:.35;animation:fpPulse 2.6s ease-out infinite}
.fp-dot{position:absolute;left:0;top:0;width:22px;height:22px;background:var(--pc);border:2.5px solid #fff;border-radius:50%;box-shadow:0 2px 6px rgba(15,35,80,.4);z-index:2}
.fp-tip{position:absolute;left:50%;top:17px;width:9px;height:9px;margin-left:-7px;background:var(--pc);border-right:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(45deg);border-bottom-right-radius:2px;z-index:1}
.fp-lab{position:absolute;left:50%;top:37px;transform:translateX(-50%);white-space:nowrap;font-size:11px;font-weight:600;color:#12264f;background:rgba(255,255,255,.94);border:1px solid rgba(47,124,246,.18);border-radius:9px;padding:1px 8px;box-shadow:0 2px 6px rgba(15,35,80,.2);pointer-events:none;z-index:3}
@keyframes fpPulse{0%{transform:scale(.5);opacity:.5}75%{transform:scale(1.4);opacity:0}100%{transform:scale(1.4);opacity:0}}

/* ===== 底部弹窗 ===== */
.sheet-overlay{position:fixed;inset:0;z-index:1000;background:rgba(18,38,79,.45);animation:fIn .2s ease;backdrop-filter:blur(2px);display:flex;align-items:flex-end;justify-content:center}
@keyframes fIn{from{opacity:0}to{opacity:1}}
.sheet{background:var(--paper);width:100%;max-width:600px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;animation:shUp .28s cubic-bezier(.2,.8,.25,1);padding:10px 18px calc(20px + env(safe-area-inset-bottom));overscroll-behavior:contain}
@keyframes shUp{from{transform:translateY(60%);opacity:.5}to{transform:none;opacity:1}}
.sheet .grab{width:40px;height:4px;border-radius:99px;background:var(--line2);margin:2px auto 14px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheet-head h3{font-family:var(--serif);font-size:18px;font-weight:700}
.sheet-foot{display:flex;gap:10px;margin-top:18px}
.sheet-foot .btn{flex:1}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:6px;font-weight:500}
.field label em{color:var(--accent);font-style:normal}
.field input,.field textarea{display:block}
.field input[type=text],.field input[type=date],.field input[type=time],.field input[type=number],.field textarea{width:100%;border:1px solid var(--line2);border-radius:11px;background:#fff;padding:10px 13px;color:var(--ink);transition:border .15s,box-shadow .15s}
.field input[type=text],.field input[type=date],.field input[type=time],.field input[type=number]{height:46px;line-height:1.2;-webkit-appearance:none;appearance:none}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,124,246,.12)}
.field textarea{resize:vertical;min-height:84px;line-height:1.7}
.field-row{display:flex;gap:10px}
.field-row .field{flex:1;min-width:0}
.place-row{display:flex;gap:8px}
.place-row input{flex:1;min-width:0}
.place-status{font-size:12px;color:var(--moss);margin-top:5px;min-height:16px}
.place-status.none{color:var(--ink3)}
.place-results{margin-top:8px;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#fff}
.place-results button{display:block;width:100%;text-align:left;border:0;background:none;cursor:pointer;padding:9px 13px;font-size:13px;color:var(--ink2);border-bottom:1px solid var(--line)}
.place-results button:last-child{border-bottom:0}
.place-results button:active{background:rgba(47,124,246,.07);color:var(--ink)}
.photo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}
.photo-grid .pg{position:relative;aspect-ratio:1;border-radius:9px;overflow:hidden;background:#e3eefc}
.photo-grid .pg img{width:100%;height:100%;object-fit:cover}
.photo-grid .pg .rm{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;cursor:pointer;background:rgba(12,32,74,.65);color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.confirm-msg{color:var(--ink2);font-size:14px;line-height:1.8}
.mode-chips{display:flex;gap:7px;flex-wrap:wrap}
.mode-chips button{border:1px solid var(--line2);background:#fff;border-radius:99px;padding:6px 13px;font-size:13px;cursor:pointer;color:var(--ink2)}
.mode-chips button.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* ===== 灯箱 / toast ===== */
.lightbox{position:fixed;inset:0;z-index:1100;background:rgba(10,25,55,.94);display:none;align-items:center;justify-content:center}
.lightbox img{max-width:94vw;max-height:78vh;border-radius:6px}
.lb-cap{position:absolute;bottom:30px;left:0;right:0;text-align:center;color:rgba(255,255,255,.88);font-size:13px;padding:0 50px}
.lb-cap b{font-family:var(--serif);font-size:15px;display:block;margin-bottom:2px}
.lb-btn{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center}
.lb-prev{left:12px}.lb-next{right:12px}
.lb-close{position:absolute;top:14px;right:14px;top:16px;transform:none}
.lb-count{position:absolute;top:22px;left:20px;color:rgba(255,255,255,.65);font-size:12.5px;letter-spacing:1px}
.toast{position:fixed;bottom:calc(var(--tabbar-h) + 26px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(14px);background:#12264f;color:#eef4ff;padding:10px 20px;border-radius:11px;font-size:13.5px;box-shadow:0 10px 30px rgba(18,38,79,.35);z-index:1300;opacity:0;transition:all .25s;pointer-events:none;max-width:86vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header class="topbar"><div class="topbar-in" id="topbar"></div></header>
<main class="wrap" id="app"><div class="boot">正在翻开行途录……</div></main>
<nav class="tabbar" id="tabbar"></nav>
<input type="file" id="import-file" accept=".json,application/json" hidden>
<div class="lightbox" id="lightbox"></div>

<script>
/* ============================================================
   行途录 · 旅行记录 —— 手机优先 · 纯本地单文件应用
   数据保存在本浏览器 IndexedDB,支持导出/导入 JSON 备份
   ============================================================ */
'use strict';

/* ---------- 小工具 ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const uid=()=>(crypto.randomUUID?crypto.randomUUID():'id-'+Date.now().toString(36)+Math.random().toString(36).slice(2,10));
const WD='日一二三四五六';
const pdate=s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d);};
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const fmtMD=s=>{const p=String(s).split('-');return (+p[1])+'月'+(+p[2])+'日';};
const fmtYMD=s=>{const p=String(s).split('-');return p[0]+'年'+(+p[1])+'月'+(+p[2])+'日';};
const fmtWeek=s=>'周'+WD[pdate(s).getDay()];
const tripDays=t=>(t.startDate&&t.endDate)?Math.max(1,Math.round((pdate(t.endDate)-pdate(t.startDate))/864e5)+1):0;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const clampDate=(v,a,b)=>{if(a&&v<a)return a;if(b&&v>b)return b;return v;};
const money=n=>'¥'+(+n||0).toLocaleString('zh-CN',{maximumFractionDigits:2});

function icon(name,s=16){
  const P={
    plus:'<path d="M12 5v14"/><path d="M5 12h14"/>',
    x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
    edit:'<path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>',
    trash:'<path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="m19 6-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/>',
    pin:'<path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
    back:'<path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>',
    left:'<path d="m15 18-6-6 6-6"/>',
    right:'<path d="m9 18 6-6-6-6"/>',
    search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
    compass:'<circle cx="12" cy="12" r="10"/><path d="m16.2 7.8-2.1 6.3-6.3 2.1 2.1-6.3z"/>',
    image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/>',
    map:'<path d="m9 3-6 2v14l6-2 6 2 6-2V3l-6 2-6-2Z"/><path d="M9 3v14"/><path d="M15 5v14"/>',
    chart:'<path d="M3 3v18h18"/><path d="M8 17v-5"/><path d="M13 17V8"/><path d="M18 17v-3"/>',
    book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/>',
    camera:'<path d="M14.5 4h-5L7.5 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3.5L14.5 4Z"/><circle cx="12" cy="13" r="3"/>',
    calendar:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/>',
    home2:'<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M9 22V12h6v10"/>',
    user:'<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
    wallet:'<path d="M19 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0 0 4h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5"/><path d="M16 12h.01"/>',
    list:'<path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/>',
    route:'<circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/>',
    check:'<path d="M20 6 9 17l-5-5"/>',
    moon:'<circle cx="12" cy="12" r="10"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.9 4.9 1.4 1.4"/><path d="m17.7 17.7 1.4 1.4"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.3 17.7-1.4 1.4"/><path d="m19.1 4.9-1.4 1.4"/>',
    share:'<path d="M12 3v13"/><path d="m8 7 4-4 4 4"/><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/>',
  };
  return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+(P[name]||'')+'</svg>';
}

/* ---------- 类型定义 ---------- */
const ITYPES=[
  {k:'place', t:'安排', em:'📍', c:'#2f7cf6'},
  {k:'transport', t:'交通', em:'🚄', c:'#8b5cf6'},
  {k:'hotel', t:'住宿', em:'🏨', c:'#10b981'},
  {k:'food', t:'美食', em:'🍜', c:'#ff7d54'},
  {k:'note', t:'见闻', em:'✏️', c:'#ec4899'},
];
const itype=k=>ITYPES.find(x=>x.k===k)||ITYPES[0];
const OLD_TYPE_MAP={'见闻':'note','趣事':'note','心情':'note','美食':'food','交通':'transport','住宿':'hotel'};

const MODES=[
  {k:'plane',em:'✈️',t:'飞机'},{k:'hsr',em:'🚄',t:'高铁'},{k:'train',em:'🚆',t:'火车'},
  {k:'metro',em:'🚇',t:'地铁'},{k:'bus',em:'🚌',t:'大巴'},{k:'car',em:'🚗',t:'自驾'},
  {k:'taxi',em:'🚕',t:'打车'},{k:'ship',em:'🚢',t:'轮船'},{k:'bike',em:'🚲',t:'骑行'},{k:'walk',em:'🚶',t:'步行'},
];
const modeOf=k=>MODES.find(m=>m.k===k)||MODES[0];

const CATS=[
  {k:'food',em:'🍜',t:'餐饮',c:'#ff7d54'},
  {k:'trans',em:'🚌',t:'交通',c:'#8b5cf6'},
  {k:'stay',em:'🏨',t:'住宿',c:'#10b981'},
  {k:'ticket',em:'🎫',t:'门票',c:'#2f7cf6'},
  {k:'shop',em:'🛍️',t:'购物',c:'#ec4899'},
  {k:'fun',em:'🎡',t:'娱乐',c:'#ffb020'},
  {k:'other',em:'📦',t:'其他',c:'#93a5c4'},
];
const catOf=k=>CATS.find(c=>c.k===k)||CATS[6];
const PALETTE=['#2f7cf6','#10b981','#ff7d54','#8b5cf6','#ec4899','#ffb020','#06b6d4','#f43f5e'];

/* ---------- IndexedDB (v2) ---------- */
let db=null;
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open('footprints-db',2);
    r.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains('trips'))d.createObjectStore('trips',{keyPath:'id'});
      if(!d.objectStoreNames.contains('entries'))d.createObjectStore('entries',{keyPath:'id'});
      if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos',{keyPath:'id'});
      if(!d.objectStoreNames.contains('expenses'))d.createObjectStore('expenses',{keyPath:'id'});
      if(!d.objectStoreNames.contains('checklist'))d.createObjectStore('checklist',{keyPath:'id'});
    };
    r.onsuccess=e=>res(e.target.result);
    r.onerror=e=>rej(e.target.error);
  });
}
const idbReq=(mode,store,fn)=>new Promise((res,rej)=>{
  const tx=db.transaction(store,mode);const r=fn(tx.objectStore(store));
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
});
const idbPut=(s,v)=>idbReq('readwrite',s,o=>o.put(v));
const idbDel=(s,k)=>idbReq('readwrite',s,o=>o.delete(k));

const S={trips:[],entries:[],photos:[],expenses:[],checklist:[],view:'home',tripId:null,tab:'plan',galleryFilter:'all'};
let LB=null,ED=null,maps={};

const tripById=id=>S.trips.find(t=>t.id===id);
const entryById=id=>S.entries.find(e=>e.id===id);
const photoById=id=>S.photos.find(p=>p.id===id);
const itemsOf=tid=>S.entries.filter(e=>e.tripId===tid).sort((a,b)=>{
  if(a.date!==b.date)return a.date<b.date?-1:1;
  const ta=a.time||a.tDepart||'',tb=b.time||b.tDepart||'';
  if(ta!==tb)return ta<tb?-1:1;
  return (a.createdAt||0)-(b.createdAt||0);
});
const photosOfEntry=eid=>S.photos.filter(p=>p.entryId===eid);
const photosOfTrip=tid=>{
  const em={};itemsOf(tid).forEach((e,i)=>em[e.id]=i);
  return S.photos.filter(p=>p.tripId===tid).sort((a,b)=>(em[a.entryId]??99)-(em[b.entryId]??99));
};
const tripCover=t=>photosOfTrip(t.id)[0]||null;
const expensesOf=tid=>S.expenses.filter(x=>x.tripId===tid).sort((a,b)=>a.date===b.date?(a.createdAt||0)-(b.createdAt||0):(a.date<b.date?-1:1));
const sumOf=tid=>expensesOf(tid).reduce((a,x)=>a+(+x.amount||0),0);
const checklistOf=tid=>S.checklist.filter(x=>x.tripId===tid);
const tripStatus=t=>{
  const td=todayStr();
  if(t.startDate&&t.endDate){
    if(td<t.startDate)return['todo','未出发'];
    if(td>t.endDate)return['done','已结束'];
    return['doing','进行中'];
  }
  return['todo',''];
};
function globalStats(){
  const days=S.trips.reduce((a,t)=>a+tripDays(t),0);
  const cities=new Set(S.entries.filter(e=>e.placeName).map(e=>e.placeName)).size;
  const spent=S.expenses.reduce((a,x)=>a+(+x.amount||0),0);
  return{trips:S.trips.length,days,cities,photos:S.photos.length,spent};
}

let toastTimer=null;
function toast(msg){
  let el=$('#toast');
  if(!el){el=document.createElement('div');el.id='toast';el.className='toast';document.body.appendChild(el);}
  el.textContent=msg;el.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2400);
}
const sheetStack=[];
function openSheet(html){
  const ov=document.createElement('div');ov.className='sheet-overlay';
  ov.innerHTML='<div class="sheet"><div class="grab"></div>'+html+'</div>';
  document.body.appendChild(ov);
  document.body.style.overflow='hidden';
  const api={ov,close(){ov.remove();const i=sheetStack.indexOf(api);if(i>-1)sheetStack.splice(i,1);if(!sheetStack.length)document.body.style.overflow='';}};
  ov.addEventListener('mousedown',e=>{if(e.target===ov)api.close();});
  sheetStack.push(api);
  return api;
}
function confirmBox(title,msg,okText){
  return new Promise(res=>{
    const m=openSheet(
      '<h3 style="font-family:var(--serif);font-size:18px;font-weight:700;margin-bottom:10px">'+esc(title)+'</h3>'+
      '<p class="confirm-msg">'+msg+'</p>'+
      '<div class="sheet-foot"><button class="btn btn-g" data-act="no">取消</button>'+
      '<button class="btn btn-d" data-act="yes">'+esc(okText||'删除')+'</button></div>');
    m.ov.querySelector('[data-act=no]').onclick=()=>{m.close();res(false);};
    m.ov.querySelector('[data-act=yes]').onclick=()=>{m.close();res(true);};
  });
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(LB){closeLB();return;}
    const top=sheetStack[sheetStack.length-1];if(top)top.close();
  }
  if(LB&&!sheetStack.length){
    if(e.key==='ArrowLeft')lbNav(-1);
    if(e.key==='ArrowRight')lbNav(1);
  }
});

/* ---------- 照片压缩 ---------- */
function compressImage(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      let w=img.naturalWidth,h=img.naturalHeight;
      const MAX=1800;
      if(Math.max(w,h)>MAX){const r=MAX/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r);}
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      res({dataUrl:c.toDataURL('image/jpeg',.85),w,h});
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('图片读取失败'));};
    img.src=url;
  });
}

  if(!past.length)return '';
  const exact=past.filter(e=>String(e.date).slice(5)===md).sort((a,b)=>a.date<b.date?1:-1);
  let e,label;
  if(exact.length){e=exact[0];const y=now.getFullYear()-+e.date.slice(0,4);label=(y<=1?'去年':y+'年前')+'的今天';}
  else{e=past[Math.floor(Math.random()*past.length)];label='随手翻到的一页';}

function tabPlan(t,its){
  if(!its.length){
    return '<div class="empty">'+icon('route',46)+'<h3>这趟旅程还没有安排</h3><p>添加景点安排、交通班次、酒店住宿,见闻美食也能随手记</p>'+
      '<button class="btn btn-p" onclick="A.itemSheet(\''+t.id+'\')">'+icon('plus',15)+'添加第一条记录</button></div>';
  }
  const groups={};its.forEach(e=>{(groups[e.date]=groups[e.date]||[]).push(e);});
  const dates=Object.keys(groups).sort();
  /* 每日速览:一眼看清每天都去了哪,点一下跳到当天 */
  const ov=dates.map(d=>{
    const es=groups[d];
    const spots=[];
    for(const e of es){
      const s=e.type==='transport'?(e.to||e.from):e.type==='hotel'?(e.name||e.title||'住宿'):(e.placeName||e.title);
      if(s&&!spots.includes(s))spots.push(s);
    }
    const n=t.startDate&&d>=t.startDate?Math.round((pdate(d)-pdate(t.startDate))/864e5)+1:null;
    return '<div class="ov-row" onclick="A.jumpDay(\''+d+'\')">'+
      '<span class="ov-d">'+(n?'D'+n:fmtMD(d))+'</span>'+
      '<span class="ov-p">'+esc(spots.slice(0,4).join(' → '))+(spots.length>4?' …':'')+'</span>'+
      '<span class="ov-n">'+es.length+' 条</span></div>';
  }).join('');
  let html='<div class="panel ov-panel"><h3>'+icon('route',15)+'每日速览 · 点日期直达</h3>'+ov+'</div>';
  for(const d of dates){
    html+='<div class="day-h" id="day-'+d+'">'+dayLabel(t,d)+'<span class="ln"></span></div>';
    for(const e of groups[d])html+=itemCard(t,e);
    html+='<button class="day-add" onclick="A.itemSheet(\''+t.id+'\',null,\''+d+'\')">+ 这一天加一条</button>';
  }
  return html;
}

/* ---- 花销 Tab ---- */
function tabCost(t,exs){
  const total=sumOf(t.id);
  const budget=+t.budget||0;
  let head='<div class="card budget-card"><div class="budget-top">'+
    '<div><div class="big"><small>总花销 </small>'+money(total)+'</div></div>'+
    '<button class="btn btn-g btn-sm" onclick="A.budgetSheet(\''+t.id+'\')">'+(budget?'改预算':'设预算')+'</button></div>';
  if(budget){
    const rest=budget-total,pct=clamp(total/budget*100,0,100);
    head+='<div class="budget-bar"><i class="'+(total>budget?'over':'')+'" style="width:'+pct+'%"></i></div>'+
      '<div class="budget-foot"><span>预算 '+money(budget)+'</span>'+
      '<span style="color:'+(total>budget?'#ef4444':'var(--moss)')+'">'+(total>budget?'超支 '+money(total-budget):'剩余 '+money(rest))+'</span></div>';
  }
  head+='</div>';
  if(exs.length){
    const cat={};exs.forEach(x=>{cat[x.category]=(cat[x.category]||0)+(+x.amount||0);});

    {em:'📸',lab:'照片最多',v:t=>photosOfTrip(t.id).length,get:t=>photosOfTrip(t.id).length+' 张'},
    {em:'💰',lab:'花销最高',v:t=>sumOf(t.id),get:t=>money(sumOf(t.id))},

  ];

/* WGS-84 → GCJ-02:高德底图为国测局坐标系,境内标记点需纠偏 */
function wgs2gcj(lat,lng){
  if(lng<72.004||lng>137.8347||lat<0.8293||lat>55.8271)return[lat,lng];
  const a=6378245,ee=0.00669342162296594323;
  const trLat=(x,y)=>{let r=-100+2*x+3*y+.2*y*y+.1*x*y+.2*Math.sqrt(Math.abs(x));r+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;r+=(20*Math.sin(y*Math.PI)+40*Math.sin(y/3*Math.PI))*2/3;r+=(160*Math.sin(y/12*Math.PI)+320*Math.sin(y*Math.PI/30))*2/3;return r;};
  const trLng=(x,y)=>{let r=300+x+2*y+.1*x*x+.1*x*y+.1*Math.sqrt(Math.abs(x));r+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;r+=(20*Math.sin(x*Math.PI)+40*Math.sin(x/3*Math.PI))*2/3;r+=(150*Math.sin(x/12*Math.PI)+300*Math.sin(x/30*Math.PI))*2/3;return r;};
  let dLat=trLat(lng-105,lat-35),dLng=trLng(lng-105,lat-35);
  const radLat=lat/180*Math.PI;let mg=Math.sin(radLat);mg=1-ee*mg*mg;
  const sq=Math.sqrt(mg);
  dLat=(dLat*180)/((a*(1-ee))/(mg*sq)*Math.PI);
  dLng=(dLng*180)/(a/sq*Math.cos(radLat)*Math.PI);
  return[lat+dLat,lng+dLng];
}
/* 地点定位:三源并行搜索(Photon/Open-Meteo/Nominatim),超时保护+按坐标去重 */
async function geocodePlace(q){
  const enc=encodeURIComponent(q);
  const one=p=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),6000))]);
  const srcs=[
    one(fetch('https://photon.komoot.io/api/?limit=6&lang=default&q='+enc)).then(r=>r.json()).then(j=>(j.features||[]).filter(f=>f.geometry&&f.geometry.coordinates).map(f=>{const p=f.properties||{};return{name:[p.name,p.city||p.state,p.country].filter(Boolean).join(' · '),lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0]};})).catch(()=>[]),
    one(fetch('https://geocoding-api.open-meteo.com/v1/search?count=6&language=zh&format=json&name='+enc)).then(r=>r.json()).then(j=>(j.results||[]).map(x=>({name:[x.name,x.admin1,x.country].filter(Boolean).join(' · '),lat:x.latitude,lng:x.longitude}))).catch(()=>[]),
    one(fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=zh-CN&q='+enc)).then(r=>r.json()).then(j=>(j||[]).map(x=>({name:String(x.display_name).split(',').map(s=>s.trim()).slice(0,3).join(' · '),lat:parseFloat(x.lat),lng:parseFloat(x.lon)}))).catch(()=>[]),
  ];
  const all=(await Promise.all(srcs)).flat();
  const seen=new Set(),out=[];
  for(const it of all){
    const k=it.lat.toFixed(3)+','+it.lng.toFixed(3);
    if(!seen.has(k)){seen.add(k);out.push(it);}
  }
  return out;
}

function iso2to3(cc){return (ISO23[cc]||'');}
function provShort(s){
  s=String(s||'').replace(/维吾尔|回族|壮族|特别行政区|自治区|自治州|省|市/g,'');
  if(PROVINCES.includes(s))return s;
  for(const p of PROVINCES){if(s.indexOf(p)>=0)return p;}
  const en=PROV_EN[String(s||'').trim()];
  if(en)return en;
  for(const k in PROV_EN){if(String(s||'').indexOf(k)>=0)return PROV_EN[k];}
  return '';
}
/* 反查坐标 → {cc 国家码, cName 国家名, prov 省份简称, city 城市} */
async function reverseGeo(lat,lng){
  const one=p=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),6500))]);
  try{
    const j=await one(fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&accept-language=zh-CN&lat='+lat+'&lon='+lng)).then(r=>r.json());
    const a=(j&&j.address)||{};
    const cc=String(a.country_code||'').toUpperCase();
    if(cc)return{cc,cName:a.country||'',prov:cc==='CN'?provShort(a.state||a.province||''):'',city:a.city||a.county||a.town||a.village||''};
  }catch(e){}
  try{
    const j=await one(fetch('https://photon.komoot.io/reverse?lat='+lat+'&lon='+lng)).then(r=>r.json());
    const p=(j&&j.features&&j.features[0]&&j.features[0].properties)||{};
    const cc=String(p.countrycode||'').toUpperCase();
    let prov=p.state||'';
    if(cc==='CN')prov=provShort(prov);
    return{cc,cName:p.country||'',prov:cc==='CN'?prov:'',city:p.city||p.county||''};
  }catch(e){}
  return null;
}
/* 旧记录自动补齐归属信息(每次最多 6 条,静默进行) */
let rgBusy=false;
async function backfillRegions(){
  if(rgBusy)return;rgBusy=true;
  let changed=false;
  try{
    const todo=S.entries.filter(e=>e.lat!=null&&e.lng!=null&&!e.cc).slice(0,6);
    for(const e of todo){
      const rg=await reverseGeo(e.lat,e.lng);
      if(rg&&rg.cc){e.cc=rg.cc;e.cName=rg.cName||e.cName;e.prov=rg.prov||e.prov;e.city=rg.city||e.city;await idbPut('entries',e);changed=true;}
      else{e.cc=e.cc||'??';await idbPut('entries',e);}
    }
  }finally{rgBusy=false;}
  if(changed&&S.view==='map')render();
}
function popupHtml(e){
  const t=tripById(e.tripId);
  return '<b style="font-family:serif">'+esc(e.placeName||'')+'</b><br>'+
    (t?esc(t.name)+' · ':'')+(e.date?fmtYMD(e.date):'')+(e.title?'<br>'+esc(e.title):'');
}
async function initGlobalMap(){
  const el0=document.getElementById('global-map');if(!el0)return;
  if(!await ensureLeaflet()){mapFallback(el0,'地图组件未能加载(可能处于离线状态),其余功能不受影响');return;}
  const el=document.getElementById('global-map');if(!el||!el.isConnected)return;
  const located=S.entries.filter(e=>e.lat!=null&&e.lng!=null&&tripById(e.tripId));
  if(!located.length){mapFallback(el,'去过并定位的地方,都会点亮在这张地图上');return;}
  const m=L.map(el,{scrollWheelZoom:true});
  L.tileLayer(TILE_URL,{maxZoom:18,subdomains:['01','02','03','04'],attribution:TILE_ATTR}).addTo(m);
  maps.global=m;
  const bounds=[];
  /* 高德/百度足迹风格的点亮标记 */
  function fpIcon(color,label){
    return L.divIcon({className:'fp-wrap',iconSize:[28,58],iconAnchor:[14,35],
      html:'<div class="fp-pin" style="--pc:'+color+'">'+
        (label?'<span class="fp-lab">'+esc(label)+'</span>':'')+
        '<span class="fp-halo"></span><span class="fp-dot"></span><span class="fp-tip"></span></div>'});
  }
  S.trips.forEach((t,ti)=>{
    const es=itemsOf(t.id).filter(e=>e.lat!=null&&e.lng!=null);
    if(!es.length)return;
    const c=PALETTE[ti%PALETTE.length];
    const pts=es.map(e=>wgs2gcj(e.lat,e.lng));bounds.push(...pts);
    if(pts.length>1){
      L.polyline(pts,{color:c,weight:8,opacity:.16,lineCap:'round',lineJoin:'round'}).addTo(m);
      L.polyline(pts,{color:c,weight:3,opacity:.8,lineCap:'round',lineJoin:'round'}).addTo(m);
    }
    es.forEach(e=>{
      const[la,lo]=wgs2gcj(e.lat,e.lng);
      L.marker([la,lo],{icon:fpIcon(c,e.placeName||e.title||'')}).addTo(m).bindPopup(popupHtml(e));
    });
  });
  if(bounds.length)m.fitBounds(bounds,{padding:[40,40],maxZoom:10});
  setTimeout(()=>m.invalidateSize(),120);
}

/* ---------- 点亮地图(中国省份 / 世界国家 + 地区钻取) ---------- */
const LG={lv:'cn',drill:null};
let _gjCN=null,_gjW=null;
async function fetchChinaGeo(){
  if(_gjCN)return _gjCN;
  const urls=[
    'https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json',
    'https://cdn.jsdelivr.net/gh/ychda/china-geojson@master/100000_full.json',
  ];
  for(const u of urls){
    try{const r=await fetch(u);if(r.ok){_gjCN=await r.json();return _gjCN;}}catch(e){}
  }
  throw new Error('china geo fail');
}
async function fetchWorldGeo(){
  if(_gjW)return _gjW;
  const urls=[
    'https://cdn.jsdelivr.net/gh/johan/world.geo.json@master/countries.geo.json',
    'https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json',
  ];
  for(const u of urls){
    try{const r=await fetch(u);if(r.ok){_gjW=await r.json();return _gjW;}}catch(e){}
  }
  throw new Error('world geo fail');
}
function featProv(f){return provShort((f.properties&&f.properties.name)||'');}
function featISO3(f){return String(f.id||'').toUpperCase();}
function litCityIcon(color){
  return L.divIcon({className:'fp-wrap',iconSize:[20,26],iconAnchor:[10,20],
    html:'<div class="fp-pin lg-pin" style="--pc:'+color+'"><span class="fp-halo"></span><span class="fp-dot"></span><span class="fp-tip"></span></div>'});
}
async function initLightMap(){
  const holder=document.getElementById('light-map');if(!holder)return;
  if(!await ensureLeaflet()){mapFallback(holder,'地图组件未能加载(可能处于离线状态),其余功能不受影响');return;}
  if(maps.light){try{maps.light.remove();}catch(e){}maps.light=null;}
  const el=document.getElementById('light-map');if(!el||!el.isConnected)return;
  const m=L.map(el,{zoomControl:false,attributionControl:false,scrollWheelZoom:false,doubleClickZoom:false,dragging:true});
  maps.light=m;
  const ld=el.querySelector('.lg-loading');if(ld)ld.remove();
  setTimeout(()=>m.invalidateSize(),120);
  const located=S.entries.filter(e=>e.lat!=null&&e.lng!=null&&tripById(e.tripId));
  const reged=located.filter(e=>e.cc&&e.cc!=='??');
  const provSet=new Set(reged.filter(e=>e.prov).map(e=>e.prov));
  const iso3Set=new Set(reged.map(e=>iso2to3(e.cc)).filter(Boolean));
  const ccSet=new Set(reged.map(e=>e.cc));
  let gj;
  try{gj=await (LG.lv==='cn'?fetchChinaGeo():fetchWorldGeo());}
  catch(err){mapFallback(el,'地图边界数据加载失败,请检查网络后重进足迹页');return;}
  const el2=document.getElementById('light-map');if(!el2||!el2.isConnected)return;
  const litFn=f=>LG.lv==='cn'?provSet.has(featProv(f)):iso3Set.has(featISO3(f));
  const base=L.geoJSON(gj,{
    style:f=>{const lit=litFn(f);
      return LG.drill?{color:'#1c2a4e',weight:.8,fillColor:'#101c38',fillOpacity:.75}
        :{color:lit?'#7db2ff':'#22335f',weight:lit?1.4:.8,fillColor:lit?'#2f6ef6':'#152142',fillOpacity:lit?.95:.85};},
    onEachFeature:(f,ly)=>{
      const lit=litFn(f);
      ly.on('click',()=>{
        if(LG.lv==='cn'){
          const p=featProv(f);
          if(lit&&p)A.drillProv(p);
          else toast('还没去过 '+((f.properties&&f.properties.name)||'这里')+',去旅行把它点亮吧 ✨');
        }else{
          const i3=featISO3(f);
          const cc=Object.keys(ISO23).find(k=>ISO23[k]===i3);
          if(lit&&cc)A.drillCountry(cc);
          else toast('还没去过这个国家,去旅行把它点亮吧 ✨');
        }
      });
    }
  }).addTo(m);
  /* 面包屑 + 徽章网格 */
  const crumbEl=document.getElementById('lg-crumb'),chipsEl=document.getElementById('lg-chips');
  const chip=(txt,lit,fn)=>'<span class="lg-chip'+(lit?' lit':'')+'" '+(lit&&fn?'onclick="'+fn+'"':'')+'>'+esc(txt)+'</span>';
  if(LG.drill){
    /* 钻取:该地区点亮的城市 */
    const cities=located.filter(e=>{
      if(LG.drill.type==='prov')return e.prov===LG.drill.key;
      return e.cc===LG.drill.key;
    });
    const nameOf=LG.drill.type==='prov'?LG.drill.key:(reged.find(e=>e.cc===LG.drill.key)||{}).cName||LG.drill.key;
    const gl=L.geoJSON({type:'FeatureCollection',features:gj.features.filter(f=>LG.lv==='cn'?featProv(f)===LG.drill.key:featISO3(f)===(iso2to3(LG.drill.key)||featISO3(f)))},
      {style:{color:'#8ec3ff',weight:1.6,fillColor:'#2f6ef6',fillOpacity:.35}}).addTo(m);
    try{m.fitBounds(gl.getBounds(),{padding:[16,16]});}catch(e){}
    const seen=new Set();const marks=[];
    for(const e of cities){
      const label=e.placeName||e.title||'';
      if(!label||seen.has(label+e.lat))continue;seen.add(label+e.lat);
      const[la,lo]=wgs2gcj(e.lat,e.lng);
      L.marker([la,lo],{icon:litCityIcon('#38bdf8')}).addTo(m).bindPopup(popupHtml(e));
      if(!marks.includes(label))marks.push(label);
    }
    if(crumbEl){crumbEl.hidden=false;crumbEl.innerHTML='<button onclick="A.drillBack()">‹ 返回</button><span>'+(LG.lv==='cn'?'中国 · ':'')+'<b>'+esc(nameOf)+'</b> · 点亮 '+marks.length+' 个地方</span>';}
    if(chipsEl){chipsEl.innerHTML=marks.map(t=>chip(t,true,null)).join('')||'<span class="lg-chip">该地区还没有定位记录</span>';}
  }else{
    try{m.fitBounds(base.getBounds(),{padding:[8,8]});}catch(e){}
    if(crumbEl)crumbEl.hidden=true;
    if(chipsEl){
      chipsEl.innerHTML=LG.lv==='cn'
        ?PROVINCES.map(p=>chip(p,provSet.has(p),'A.drillProv(\''+p+'\')')).join('')
        :reged.filter(e=>e.cName).reduce((a,e)=>{if(!a.some(x=>x.cc===e.cc))a.push(e);return a;},[])
            .map(e=>chip(e.cName||e.cc,true,'A.drillCountry(\''+e.cc+'\')')).join('')||'<span class="lg-chip">去国外旅行后,这里会点亮国家</span>';
    }
  }
}

/* ============================================================
   旅程分享图(Canvas 绘制 1080×1440,适合抖音/小红书)
   ============================================================ */
function rrect(ctx,X,Y,W,H,R){
  ctx.beginPath();
  ctx.moveTo(X+R,Y);
  ctx.arcTo(X+W,Y,X+W,Y+H,R);
  ctx.arcTo(X+W,Y+H,X,Y+H,R);
  ctx.arcTo(X,Y+H,X,Y,R);
  ctx.arcTo(X,Y,X+W,Y,R);
  ctx.closePath();
}
function fitFont(ctx,text,max,size,weight){
  do{ctx.font=weight+' '+size+'px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';if(ctx.measureText(text).width<=max)break;size-=4;}while(size>28);
  return size;
}
function wrapLines(x,text,maxW){
  const lines=[];let cur='';
  for(const ch of String(text)){const t2=cur+ch;if(x.measureText(t2).width>maxW&&cur){lines.push(cur);cur=ch;}else cur=t2;}
  if(cur)lines.push(cur);return lines;
}
/* ============================================================
   旅程分享图 V2 —— 手账攻略风(米黄底/虚线手账框/Day 面板/拍立得)
   ============================================================ */
async function renderShareCards(t){
  const W=1080,H=1440;
  const C={bg:'#f9f4e8',ink:'#3a352c',red:'#d6493f',orange:'#ee8c2c',green:'#6fae3f',blue:'#3f7fd6',gold:'#f2b73f',paper:'#fffdf7',soft:'rgba(58,53,44,.55)'};
  const FAM='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
  const out=cv=>cv.toDataURL('image/jpeg',.92);
  const loadImg=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});
  const its=itemsOf(t.id),ps=photosOfTrip(t.id),exs=expensesOf(t.id);
  const days=tripDays(t);
  /* 每日路线行 */
  const groups={};its.forEach(e=>{(groups[e.date]=groups[e.date]||[]).push(e);});
  const dates=Object.keys(groups).sort();
  const dayRows=[];
  dates.forEach((d,i)=>{
    const es=groups[d];
    const spots=[];
    for(const e of es){
      const s=e.type==='transport'?(e.to||e.from):e.type==='hotel'?(e.name||e.title||'住宿'):(e.placeName||e.title);
      if(s&&!spots.includes(s))spots.push(s);
    }
    if(!spots.length)for(const e of es){if(e.title&&!spots.includes(e.title))spots.push(e.title);}
    if(!spots.length)return;
    const n=t.startDate&&d>=t.startDate?Math.round((pdate(d)-pdate(t.startDate))/864e5)+1:(i+1);
    dayRows.push({tag:n,date:fmtMD(d)+' '+fmtWeek(d),txt:spots.join(' — ')});
  });
  const chunk=(a,n)=>{const r=[];for(let i=0;i<a.length;i+=n)r.push(a.slice(i,i+n));return r;};
  const routePages=chunk(dayRows,5);
  const hiPicks=its.filter(e=>e.title||e.placeName).sort((a,b)=>((b.photoIds&&b.photoIds.length)?1:0)-((a.photoIds&&a.photoIds.length)?1:0)).slice(0,5);
  const photoWall=ps.length>=4?ps.slice(0,9):null;
  const total=1+routePages.length+(exs.length?1:0)+(hiPicks.length?1:0)+(photoWall?1:0);
  const pages=[];
  const PC=['#d6493f','#ee8c2c','#6fae3f','#3f7fd6','#8e6fc1','#2fa6a0'];
  /* —— 手账页面公共件 —— */
  const mk=()=>{
    const cv=document.createElement('canvas');cv.width=W;cv.height=H;
    const x=cv.getContext('2d');
    x.fillStyle=C.bg;x.fillRect(0,0,W,H);
    x.save();x.setLineDash([14,10]);x.lineWidth=3;x.strokeStyle=C.ink;
    rrect(x,26,26,W-52,H-52,30);x.stroke();x.restore();
    return{cv,x};
  };
  const badge=(x,i)=>{
    const txt='第 '+(i+1)+' / '+total+' 页';
    x.font='700 28px '+FAM;
    const w=x.measureText(txt).width+40;
    x.save();rrect(x,W-56-w,58,w,54,27);x.fillStyle=C.paper;x.fill();
    x.setLineDash([8,6]);x.lineWidth=2.5;x.strokeStyle=C.ink;x.stroke();x.restore();
    x.fillStyle=C.ink;x.textAlign='center';x.fillText(txt,W-56-w/2,96);
  };
  const foot=x=>{
    x.textAlign='center';
    x.fillStyle=C.soft;x.font='30px '+FAM;
    x.fillText('🚐  行 途 录 · XINGTU  ·  记录每一段旅程  🚩',W/2,1378);
  };
  const pill=(x,text,cx,cy,bg,fg,fs,pad)=>{
    fs=fs||34;pad=pad||20;
    x.font='800 '+fs+'px '+FAM;
    const w=x.measureText(text).width+pad*2,h=fs+pad;
    rrect(x,cx-w/2,cy-h/2,w,h,h/2);x.fillStyle=bg;x.fill();
    x.fillStyle=fg;x.textAlign='center';x.fillText(text,cx,cy+fs*.36);
    return w;
  };

  /* 预计算:每日路线行 */
  const groups={};its.forEach(e=>{(groups[e.date]=groups[e.date]||[]).push(e);});
  const dates=Object.keys(groups).sort();

      const s=e.type==='transport'?(e.to||e.from):e.type==='hotel'?(e.name||e.title||'住宿'):(e.placeName||e.title);

        '<div class="field"><label>开始日期</label><input type="date" id="f-start"></div>'+

  async delTrip(id){
    const t=tripById(id);if(!t)return;
    const n=itemsOf(id).length,np=photosOfTrip(id).length,nx=expensesOf(id).length,nc=checklistOf(id).length;
    const ok=await confirmBox('删除「'+esc(t.name)+'」?',
      '将同时删除其中 <b>'+n+'</b> 条记录、<b>'+np+'</b> 张照片、<b>'+nx+'</b> 笔花销与 <b>'+nc+'</b> 项清单,无法恢复。');
    if(!ok)return;
    for(const p of S.photos.filter(p=>p.tripId===id))await idbDel('photos',p.id);
    for(const e of S.entries.filter(e=>e.tripId===id))await idbDel('entries',e.id);
    for(const x of S.expenses.filter(x=>x.tripId===id))await idbDel('expenses',x.id);
    for(const c of S.checklist.filter(c=>c.tripId===id))await idbDel('checklist',c.id);
    await idbDel('trips',id);
    S.photos=S.photos.filter(p=>p.tripId!==id);
    S.entries=S.entries.filter(e=>e.tripId!==id);
    S.expenses=S.expenses.filter(x=>x.tripId!==id);
    S.checklist=S.checklist.filter(c=>c.tripId!==id);
    S.trips=S.trips.filter(x=>x.id!==id);
    S.view='home';S.tripId=null;
    render();toast('旅程已删除');
  },
